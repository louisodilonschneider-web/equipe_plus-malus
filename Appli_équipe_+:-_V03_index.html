            ' <button class="btn small" data-act="l.playGame" data-id="' + l.id + '" data-r="' + ri + '" data-g="' + gi + '">' + (m ? (m.status === 'done' ? 'Bilan' : 'Reprendre') : 'Lancer') + '</button></div>';
        }).join('') + '</div>' + (r.rest.length ? '<p class="muted small">Observent : ' + r.rest.map(function (id) { var t = APP.byId(l.teams, id); return t ? esc(t.name) : ''; }).join(', ') + '</p>' : '') + '</li>';
      }).join('') + '</ol></section>';
    }
    var set = KIOSK.settings(l);
    var opt = function (k, title, hint) {
      return '<label class="toggle"><input type="checkbox" data-chg="l.kioskSet" data-id="' + l.id + '" data-k="' + k + '"' + (set[k] ? ' checked' : '') + '><span><b>' + title + '</b><small>' + hint + '</small></span></label>';
    };
    h += '<section class="card"><div class="card-head"><h3>Matchs de la leçon</h3><span class="muted small">Coche ceux qui apparaissent sur la tablette des élèves</span></div>' +
      (ms.length ? '<ul class="match-list">' + ms.map(function (m) {
        var r = ARENA.replay(m);
        return '<li><label class="k-toggle" title="Visible sur la tablette"><input type="checkbox" data-chg="l.kioskMatch" data-id="' + m.id + '"' + (m.onKiosk !== false ? ' checked' : '') + '> tablette</label>' +
          '<a href="#/match/' + m.id + '">' + (m.terrain ? '<span class="muted">T' + esc(m.terrain) + '</span> ' : '') + UI.chip(m.teams.A) + ' <b>' + r.score.A + ' – ' + r.score.B + '</b> ' + UI.chip(m.teams.B) + '</a>' +
          '<span class="muted small">' + (m.status === 'done' ? 'terminé' : m.status === 'live' ? 'en cours' : 'prêt') + ' · ' + APP.fmtTime(r.end) + '</span>' +
          '<button class="icon-btn" data-act="l.delMatch" data-id="' + m.id + '" aria-label="Supprimer le match">' + UI.icon('trash', 16) + '</button></li>';
      }).join('') + '</ul>' : '<p class="muted">Aucun match préparé. Fais le planning ou ajoute un match : c\'est toi qui décides ce que les élèves auront sur la tablette.</p>') + '</section>';
    h += '<section class="card"><div class="card-head"><h3>Tablette des élèves</h3><button class="btn primary" data-act="l.kiosk" data-id="' + l.id + '">' + UI.icon('lock', 16) + ' Lancer le kiosque</button></div>' +
      '<p class="hint">Dans le kiosque, les élèves ne créent rien : ils choisissent parmi les matchs cochés ci-dessus et notent ce qui se passe.</p>' +
      opt('end', 'Les élèves peuvent terminer le match', 'Sinon, c\'est toi qui le termines depuis ton appareil.') +
      opt('report', 'Les élèves voient le bilan', 'Score, rapport de force et pourcentages, sans plus/malus ni niveau.') +
      opt('atelier', 'Les élèves voient leur atelier', 'Chaque élève touche son prénom et voit sa situation.') + '</section>';
    return h;
  }

  // Un match prêt pour chaque rencontre du tournoi : l'enseignant n'a plus
  // qu'à lancer le kiosque, les élèves trouvent tout en place.
  function createScheduleMatches(st, l) {
    l.schedule.forEach(function (r, ri) {
      r.games.forEach(function (g) {
        if (g.matchId && APP.byId(st.matches, g.matchId)) return;
        var m = ARENA.create(l, g.a, g.b, String(g.terrain));
        m.round = ri + 1;
        st.matches.push(m);
        g.matchId = m.id;
      });
    });
  }

  /* ---------- Générateur de tournoi ---------- */

  // Filles seulement, garçons seulement ou mixte : sert à proposer
  // « filles contre filles, garçons contre garçons » quand les équipes
  // ont été composées en non mixte.
  function genderOf(t) {
    var sx = {};
    t.members.forEach(function (sid) { var s = APP.student(sid); sx[s && s.sex === 'F' ? 'F' : 'G'] = 1; });
    var k = Object.keys(sx);
    return k.length === 1 ? k[0] : 'X';
  }

  function tourneyPlan(l, o) {
    var ids = l.teams.map(function (t) { return t.id; });
    var g = {};
    l.teams.forEach(function (t) { g[t.id] = genderOf(t); });
    var list;
    if (o.mode === 'choix') {
      list = o.picks.map(function (k) { var p = k.split('|'); return [p[0], p[1]]; })
        .filter(function (f) { return APP.byId(l.teams, f[0]) && APP.byId(l.teams, f[1]); });
      if (o.sameGender) list = list.filter(function (f) { return g[f[0]] === g[f[1]]; });
    } else if (o.sameGender) {
      list = [];
      ['F', 'G', 'X'].forEach(function (k) {
        list = list.concat(ARENA.fixtures(ids.filter(function (id) { return g[id] === k; }), o.mode));
      });
    } else list = ARENA.fixtures(ids, o.mode);
    return { list: list, rounds: ARENA.planRounds(ids, list, o.terrains, o.legs) };
  }

  function pairKey(a, b, ids) { return ids.indexOf(a) < ids.indexOf(b) ? a + '|' + b : b + '|' + a; }

  function tourneyModal(l) {
    var ids = l.teams.map(function (t) { return t.id; });
    var allPairs = [];
    ids.forEach(function (a, i) { ids.slice(i + 1).forEach(function (b) { allPairs.push(a + '|' + b); }); });
    var prev = l.tourney || {};
    var o = {
      mode: prev.mode || 'toutes',
      terrains: prev.terrains || Math.max(1, Math.floor(ids.length / 2)),
      legs: prev.legs || 1,
      sameGender: !!prev.sameGender,
      replace: true,
      picks: (prev.picks || allPairs).filter(function (k) { return allPairs.indexOf(k) >= 0; }),
      focus: ids[0]
    };
    var genders = {};
    l.teams.forEach(function (t) { genders[genderOf(t)] = (genders[genderOf(t)] || 0) + 1; });
    var canGender = (genders.F || 0) >= 2 || (genders.G || 0) >= 2;
    var unplayed = APP.matchesOf(l.id).filter(function (m) { return m.status === 'ready' && !m.events.length; }).length;
    var played = APP.matchesOf(l.id).length - unplayed;

    function body() {
      var plan = tourneyPlan(l, o), n = plan.list.length * o.legs;
      var h = '<label class="field"><span>Qui rencontre qui ?</span><select data-t="mode">' +
        [['toutes', 'Toutes contre toutes — chaque équipe rencontre toutes les autres'], ['simple', 'Un tour simple — chaque équipe joue une fois'], ['choix', 'Je choisis les affiches équipe par équipe']].map(function (x) {
          return '<option value="' + x[0] + '"' + (o.mode === x[0] ? ' selected' : '') + '>' + x[1] + '</option>';
        }).join('') + '</select></label>';
      if (o.mode === 'choix') {
        var focus = APP.byId(l.teams, o.focus) || l.teams[0];
        h += '<fieldset class="pick-box"><legend>Adversaires de chaque équipe</legend>' +
          '<p class="hint">Choisis une équipe, puis coche celles qu\'elle doit rencontrer. Une affiche cochée d\'un côté l\'est forcément de l\'autre : les Bleus contre les Verts, c\'est la même rencontre que les Verts contre les Bleus.</p>' +
          '<label class="field"><span>Équipe</span><select data-t="focus">' + l.teams.map(function (t) {
            return '<option value="' + t.id + '"' + (t.id === focus.id ? ' selected' : '') + '>' + esc(t.name) + '</option>';
          }).join('') + '</select></label>' +
          '<div class="opp-grid">' + l.teams.filter(function (t) { return t.id !== focus.id; }).map(function (t) {
            var on = o.picks.indexOf(pairKey(focus.id, t.id, ids)) >= 0;
            return '<label class="opp' + (on ? ' on' : '') + '"><input type="checkbox" data-t="pick" data-b="' + t.id + '"' + (on ? ' checked' : '') + '>' + UI.dot(t.color, 18) + '<b>' + esc(t.name) + '</b></label>';
          }).join('') + '</div>' +
          '<div class="row-actions"><button type="button" class="btn small" data-t="all">Tout cocher</button><button type="button" class="btn small ghost" data-t="none">Tout décocher</button></div>' +
          '<p class="fixtures"><b>' + APP.plural(o.picks.length, 'affiche retenue', 'affiches retenues') + ' :</b> ' + o.picks.map(function (k) {
            var p = k.split('|'), a = APP.byId(l.teams, p[0]), b = APP.byId(l.teams, p[1]);
            return '<span class="fx" style="border-color:' + UI.color(a.color).hex + '">' + esc(a.name) + ' – ' + esc(b.name) + '</span>';
          }).join(' ') + '</p></fieldset>';
      }
      h += '<label class="field"><span>Terrains disponibles</span><input type="number" min="1" max="8" value="' + o.terrains + '" data-t="terrains"><small class="hint">Autant de rencontres par tour. Les autres équipes observent.</small></label>' +
        '<label class="field"><span>Combien de fois chaque affiche se joue-t-elle ?</span><select data-t="legs">' +
        [[1, 'Une fois — match aller seulement'], [2, 'Deux fois — aller et retour'], [3, 'Trois fois']].map(function (x) {
          return '<option value="' + x[0] + '"' + (o.legs === x[0] ? ' selected' : '') + '>' + x[1] + '</option>';
        }).join('') + '</select><small class="hint">Au match retour, les deux équipes changent de côté sur la feuille. Tous les matchs aller se jouent avant les retours.</small></label>';
      h += canGender
        ? '<label class="check big-check"><input type="checkbox" data-t="gender"' + (o.sameGender ? ' checked' : '') + '> Filles contre filles, garçons contre garçons</label>'
        : '<p class="hint">Toutes les équipes sont mixtes ou d\'un seul genre : l\'appariement par genre ne s\'applique pas.</p>';
      h += '<label class="check big-check"><input type="checkbox" data-t="replace"' + (o.replace ? ' checked' : '') + '> Remplacer les matchs déjà créés' +
        (unplayed || played ? ' <small class="muted">(' + unplayed + ' pas encore joué' + (unplayed > 1 ? 's' : '') + (played ? ' ; les ' + played + ' déjà commencés ou joués sont gardés' : '') + ')</small>' : '') + '</label>';
      h += '<div class="summary">' + (n
        ? '<b>' + APP.plural(n, 'match', 'matchs') + '</b> en <b>' + APP.plural(plan.rounds.length, 'tour') + '</b> de ' + Math.min(o.terrains, Math.max.apply(null, plan.rounds.map(function (r) { return r.games.length; }))) + '. Les équipes qui ne jouent pas pendant un tour seront désignées comme observatrices.'
        : 'Aucune rencontre : coche au moins une affiche.') + '</div>';
      return h;
    }

    UI.modal({
      title: 'Générer le tournoi', okLabel: 'Générer', wide: true, body: '<div data-tb>' + body() + '</div>',
      onOpen: function (root) {
        var box = root.querySelector('[data-tb]');
        var redraw = function () { box.innerHTML = body(); };
        root.addEventListener('change', function (e) {
          var t = e.target.getAttribute('data-t');
          if (!t) return;
          if (t === 'mode') o.mode = e.target.value;
          else if (t === 'focus') o.focus = e.target.value;
          else if (t === 'terrains') o.terrains = APP.clamp(parseInt(e.target.value, 10) || 1, 1, 8);
          else if (t === 'legs') o.legs = parseInt(e.target.value, 10) || 1;
          else if (t === 'gender') o.sameGender = e.target.checked;
          else if (t === 'replace') o.replace = e.target.checked;
          else if (t === 'pick') {
            var k = pairKey(o.focus, e.target.getAttribute('data-b'), ids);
            o.picks = o.picks.filter(function (x) { return x !== k; });
            if (e.target.checked) o.picks.push(k);
            o.picks.sort(function (x, y) { return allPairs.indexOf(x) - allPairs.indexOf(y); });
          }
          redraw();
        });
        root.addEventListener('click', function (e) {
          var t = e.target.getAttribute && e.target.getAttribute('data-t');
          if (t === 'all') { o.picks = allPairs.slice(); redraw(); }
          if (t === 'none') { o.picks = []; redraw(); }
        });
      },
      onOk: function () {
        var plan = tourneyPlan(l, o);
        if (!plan.list.length) { UI.toast('Aucune rencontre à générer.', 'err'); return false; }
        APP.set(function (st) {
          if (o.replace) {
            st.matches = st.matches.filter(function (m) { return !(m.lessonId === l.id && m.status === 'ready' && !m.events.length); });
            l.schedule = [];
          }
          l.schedule = (l.schedule || []).concat(plan.rounds);
          createScheduleMatches(st, l);
          l.tourney = { mode: o.mode, terrains: o.terrains, legs: o.legs, sameGender: o.sameGender, picks: o.picks };
        });
        UI.toast('Tournoi prêt : ' + APP.plural(plan.list.length * o.legs, 'match', 'matchs') + ' sur la tablette.');
      }
    });
  }

  /* ---------- Fenêtres ---------- */

  function composeModal(l) {
    var present = APP.studentsOfCycle(l.cycleId).filter(function (s) { return status(l, s.id) === 'P'; }).length;
    var o = APP.clone(l.composition || {});
    if (!o.count || !l.teams.length) o.count = Math.max(2, Math.round(present / (l.maxOnField + 1.5)));
    var radios = function (name, list, cur) {
      return list.map(function (m) {
        return '<label class="radio"><input type="radio" name="' + name + '" value="' + m.id + '"' + (m.id === cur ? ' checked' : '') + '><span><b>' + m.label + '</b><small>' + m.hint + '</small></span></label>';
      }).join('');
    };
    UI.modal({
      title: 'Composer les équipes', okLabel: 'Composer',
      body: '<p class="muted">' + present + ' élèves présents (les blessés et les « autres rôles » ne sont pas répartis).</p>' +
        '<label class="field inline"><span>Nombre d\'équipes</span><input type="number" min="1" max="12" value="' + o.count + '" data-count></label>' +
        '<div class="field"><span>Niveau</span>' + radios('lv', TEAMS.LEVEL_MODES, o.level || 'equilibre') + '</div>' +
        '<div class="field"><span>Filles / garçons</span>' + radios('mx', TEAMS.MIX_MODES, o.mix || 'mixte') + '</div>',
      onOk: function (root) {
        var next = {
          count: APP.clamp(parseInt(root.querySelector('[data-count]').value, 10) || 2, 1, 12),
          level: root.querySelector('input[name=lv]:checked').value,
          mix: root.querySelector('input[name=mx]:checked').value,
          strongMore: o.strongMore !== false
        };
        var go = function () { APP.set(function () { applyComposition(l, next); }); UI.toast('Équipes composées.'); };
        if (next.level === 'homogene' && next.count % 2 && next.count >= 3) {
          setTimeout(function () {
            UI.choose('Nombre impair d\'équipes', 'Avec ' + next.count + ' équipes, il faut choisir :', [
              { label: 'Plus d\'équipes fortes', hint: Math.ceil(next.count / 2) + ' fortes, ' + Math.floor(next.count / 2) + ' plus faibles', value: true, primary: true },
              { label: 'Plus d\'équipes faibles', hint: Math.floor(next.count / 2) + ' fortes, ' + Math.ceil(next.count / 2) + ' plus faibles', value: false }
            ], function (v) { next.strongMore = v; go(); });
          }, 0);
        } else go();
      }
    });
  }

  function teamModal(l, t) {
    var sel = t.color;
    UI.modal({
      title: 'Équipe ' + t.name, okLabel: 'Enregistrer',
      body: '<label class="field"><span>Nom</span><input data-name value="' + esc(t.name) + '"></label>' +
        '<div class="field"><span>Couleur des chasubles</span><div class="swatches">' + UI.COLORS.map(function (c) {
          return '<button type="button" class="swatch' + (c.id === sel ? ' on' : '') + '" data-color="' + c.id + '" style="background:' + c.hex + ';color:' + UI.ink(c.hex) + '">' + c.label + '</button>';
        }).join('') + '</div></div>',
      onOpen: function (root) {
        root.addEventListener('click', function (e) {
          var b = e.target.closest('[data-color]'); if (!b) return;
          var old = UI.color(sel);
          sel = b.getAttribute('data-color');
          var inp = root.querySelector('[data-name]');
          // Si l'équipe portait le nom de sa couleur, le nom suit la couleur.
          if (inp.value.trim() === old.label) inp.value = UI.color(sel).label;
          [].forEach.call(root.querySelectorAll('.swatch'), function (s) { s.classList.toggle('on', s === b); });
        });
      },
      onOk: function (root) {
        var n = root.querySelector('[data-name]').value.trim() || UI.color(sel).label;
        APP.set(function () { var x = APP.byId(l.teams, t.id); x.name = n; x.color = sel; });
      }
    });
  }

  function newMatchModal(l, cb) {
    if (l.teams.length < 2) { UI.toast('Il faut au moins deux équipes.', 'err'); return; }
    var opts = function (i) { return l.teams.map(function (t, j) { return '<option value="' + t.id + '"' + (j === i ? ' selected' : '') + '>' + esc(t.name) + '</option>'; }).join(''); };
    UI.modal({
      title: 'Nouveau match', okLabel: 'Préparer le match',
      body: '<div class="vs-pick"><select data-a>' + opts(0) + '</select><span>contre</span><select data-b>' + opts(1) + '</select></div>' +
        '<label class="field inline"><span>Terrain</span><input data-t value="" placeholder="1"></label>',
      onOk: function (root) {
        var a = root.querySelector('[data-a]').value, b = root.querySelector('[data-b]').value;
        if (a === b) { UI.toast('Choisis deux équipes différentes.', 'err'); return false; }
        var m = ARENA.create(l, a, b, root.querySelector('[data-t]').value.trim());
        APP.setQuiet(function (st) { st.matches.push(m); });
        cb(m);
      }
    });
  }

  function L(el) { return APP.lesson(el.dataset.id); }

  var acts = {
    'l.att': function (el) {
      APP.set(function () {
        var l = L(el), sid = el.dataset.sid;
        setStatus(l, sid, { P: 'A', A: 'B', B: 'P' }[status(l, sid)]);
      });
    },
    'l.allPresent': function (el) {
      APP.set(function () {
        var l = L(el);
        Object.keys(l.attendance).forEach(function (sid) { setStatus(l, sid, 'P'); });
      });
    },
    'l.pick': function (el) {
      var sid = el.dataset.sid;
      // Un élève déjà sélectionné + un appui sur un autre élève = « mets-le
      // avec celui-là ». Un second appui sur le même annule la sélection.
      if (picked && picked !== sid) {
        var l = L(el), p = placement(l, sid);
        var target = !p ? 'pool' : p.team ? p.team.id : 'others';
        var who = picked; picked = null;
        APP.set(function () { moveTo(l, who, target); });
        return;
      }
      picked = picked === sid ? null : sid;
      APP.render();
    },
    'l.unpick': function () { picked = null; APP.render(); },
    'l.moveTo': function (el) {
      if (!picked) return;
      var sid = picked; picked = null;
      APP.set(function () { moveTo(L(el), sid, el.dataset.target); });
    },
    'l.compose': function (el) {
      var l = L(el);
      if (l.teams.some(function (t) { return t.members.length; })) {
        UI.confirm('Refaire toutes les équipes ? Les équipes actuelles seront remplacées.', function () { composeModal(l); }, { okLabel: 'Refaire' });
      } else composeModal(l);
    },
    'l.copyTeams': function (el) {
      var l = L(el), from = lastLessonWithTeams(l);
      if (!from) return;
      APP.set(function () { copyTeams(l, from); });
      var left = APP.studentsOfCycle(l.cycleId).filter(function (s) { return status(l, s.id) === 'P' && !placement(l, s.id); });
      UI.toast('Équipes de la leçon ' + from.n + ' reprises' + (left.length ? ' · ' + APP.plural(left.length, 'élève') + ' à placer' : '') + '.');
    },
    'l.addTeam': function (el) {
      APP.set(function () {
        var l = L(el), c = TEAMS.freeColor(l.teams);
        l.teams.push({ id: APP.uid('t'), name: c.label, color: c.id, members: [], coaches: [] });
      });
    },
    'l.delTeam': function (el) {
      var l = L(el), t = APP.byId(l.teams, el.dataset.team);
      UI.confirm('Supprimer l\'équipe ' + t.name + ' ? Ses élèves repasseront « sans équipe ».', function () {
        APP.set(function () { l.teams = l.teams.filter(function (x) { return x.id !== t.id; }); });
      }, { danger: true, okLabel: 'Supprimer' });
    },
    'l.clearTeams': function (el) {
      UI.confirm('Défaire toutes les équipes de cette leçon ?', function () {
        APP.set(function () { var l = L(el); l.teams = []; l.schedule = []; });
      }, { danger: true, okLabel: 'Défaire' });
    },
    'l.teamEdit': function (el) {
      if (picked) { acts['l.moveTo']({ dataset: { id: el.dataset.id, target: el.dataset.team } }); return; }
      var l = L(el); teamModal(l, APP.byId(l.teams, el.dataset.team));
    },
    'l.suggest': function (el) {
      APP.set(function () {
        var l = L(el), k = APP.cls(l.classId);
        l.indicators = suggestIndicators(k && k.level);
        ensureMissed(l);
      });
      UI.toast('Indicateurs proposés selon le niveau de la classe.');
    },
    'l.actAdd': function (el) {
      APP.set(function () {
        var l = L(el);
        l.actions.push({ id: APP.uid('a'), label: 'Nouvelle action', points: 1, shot: 'made', units: 1, autoUnits: true });
        RATINGS.refreshUnits(l.actions);
      });
    },
    'l.actDel': function (el) {
      var l = L(el);
      if (l.actions.length <= 1) { UI.toast('Il faut garder au moins une action.', 'err'); return; }
      APP.set(function () { l.actions = l.actions.filter(function (a) { return a.id !== el.dataset.a; }); RATINGS.refreshUnits(l.actions); });
    },
    'l.actMove': function (el) {
      APP.set(function () {
        var l = L(el), i = l.actions.map(function (a) { return a.id; }).indexOf(el.dataset.a), j = i + (+el.dataset.k);
        if (i < 0 || j < 0 || j >= l.actions.length) return;
        var x = l.actions[i]; l.actions[i] = l.actions[j]; l.actions[j] = x;
      });
    },
    'l.actSort': function (el) { APP.set(function () { var l = L(el); l.actions = BANK.sortActions(l.actions); }); },
    'l.actAuto': function (el) {
      APP.set(function () { var l = L(el); APP.byId(l.actions, el.dataset.a).autoUnits = true; RATINGS.refreshUnits(l.actions); });
    },
    'l.actReset': function (el) {
      UI.confirm('Remettre le barème de base de l\'activité ?', function () {
        APP.set(function () { var l = L(el); l.actions = BANK.presetActions(APP.cycle(l.cycleId).sport); ensureMissed(l); });
      });
    },
    'l.newMatch': function (el) {
      newMatchModal(L(el), function () { APP.render(); UI.toast('Match prêt : il apparaît sur la tablette.'); });
    },
    'l.schedule': function (el) {
      var l = L(el);
      if (l.teams.length < 2) { UI.toast('Il faut au moins deux équipes.', 'err'); return; }
      tourneyModal(l);
    },
    'l.playGame': function (el) {
      var l = L(el), g = l.schedule[+el.dataset.r].games[+el.dataset.g];
      var m = g.matchId && APP.match(g.matchId);
      if (!m) {
        m = ARENA.create(l, g.a, g.b, String(g.terrain));
        APP.setQuiet(function (st) { st.matches.push(m); g.matchId = m.id; });
      }
      location.hash = '#/match/' + m.id;
    },
    'l.delMatch': function (el) {
      UI.confirm('Supprimer ce match et tout ce qui a été noté ?', function () {
        APP.set(function (st) { st.matches = st.matches.filter(function (m) { return m.id !== el.dataset.id; }); });
      }, { danger: true, okLabel: 'Supprimer' });
    },
    'l.kiosk': function (el) {
      var l = L(el);
      var ready = APP.matchesOf(l.id).filter(function (m) { return m.onKiosk !== false && m.status !== 'done'; });
      // Les élèves ne pouvant rien créer, un kiosque sans match serait vide.
      if (!ready.length) {
        UI.confirm('Aucun match n\'est prêt pour la tablette. Les élèves ne verront rien à saisir. Lancer quand même ?', function () { KIOSK.enter(l.id); }, { okLabel: 'Lancer quand même' });
      } else KIOSK.enter(l.id);
    }
  };

  // Activer « tirs tentés » sans action « tir raté » ne permettrait pas de
  // compter les échecs : on l'ajoute d'office, à 0 point.
  function ensureMissed(l) {
    if (l.indicators.shots && !l.actions.some(function (a) { return a.shot === 'missed'; })) {
      // En tête de liste : le tir raté vient avant le panier dans l'action.
      l.actions.unshift({ id: APP.uid('a'), label: 'Tir raté', points: 0, shot: 'missed', units: 0, autoUnits: true });
    }
  }

  var chgs = {
    'l.kioskMatch': function (el) { APP.set(function () { APP.match(el.dataset.id).onKiosk = el.checked; }); },
    'l.kioskSet': function (el) {
      APP.set(function () { var l = L(el); l.kioskSet = KIOSK.settings(l); l.kioskSet[el.dataset.k] = el.checked; });
    },
    'l.date': function (el) { APP.set(function () { L(el).date = el.value; }); },
    'l.task': function (el) {
      APP.set(function () { var o = L(el).others.filter(function (x) { return x.sid === el.dataset.sid; })[0]; if (o) o.task = el.value; });
    },
    'l.ind': function (el) {
      APP.set(function () { var l = L(el); l.indicators[el.dataset.k] = el.checked; ensureMissed(l); });
    },
    'l.num': function (el, ev) {
      var v = parseInt(el.value, 10);
      if (!(v > 0)) return;
      var fn = function () { L(el)[el.dataset.k] = v; };
      if (ev.type === 'input') APP.setQuiet(fn); else APP.set(fn);
    },
    'l.act': function (el, ev) {
      var f = el.dataset.f;
      var fn = function () {
        var l = L(el), a = APP.byId(l.actions, el.dataset.a);
        if (!a) return;
        if (f === 'points') a.points = parseFloat(el.value) || 0;
        else if (f === 'units') { a.units = parseFloat(el.value) || 0; a.autoUnits = false; }
        else a[f] = el.value;
        RATINGS.refreshUnits(l.actions);
      };
      if (ev.type === 'input' && f !== 'shot') APP.setQuiet(fn); else APP.set(fn);
    }
  };

  return {
    TASKS: TASKS, STATUS: STATUS, create: create, status: status, setStatus: setStatus, placement: placement,
    moveTo: moveTo, copyTeams: copyTeams, applyComposition: applyComposition, suggestIndicators: suggestIndicators,
    newMatchModal: newMatchModal, ensureMissed: ensureMissed, view: view,
    acts: acts, chgs: chgs
  };
})();

</script>
<script>
/* js/kiosk.js */
/*
 * Le mode kiosque : la tablette qui circule entre les élèves. Plein écran,
 * gros boutons, et surtout aucun accès aux niveaux, aux plus/malus ni aux
 * notes. Pour en sortir, il faut ton code.
 *
 * L'écran de saisie d'un match est le même pour toi et pour les élèves ;
 * seule différence, tu vois en plus le plus/malus de chaque joueur.
 */
var KIOSK = (function () {
  'use strict';
  var esc = APP.esc;

  // Changement en attente : un élève veut entrer alors que l'équipe est au
  // complet (il faut choisir qui sort), ou l'inverse. Rien n'est enregistré
  // tant que le choix n'est pas fait.
  var pending = null;
  var atelierSid = null;
  var beeped = {};

  function K() { return APP.state.kiosk; }

  function enter(lessonId) {
    APP.set(function (st) { st.kiosk = { on: true, lessonId: lessonId, matchId: null, screen: 'home' }; });
    UI.fullscreen(true);
  }

  function askExit() {
    UI.modal({
      title: 'Sortir du mode kiosque', okLabel: 'Sortir',
      body: '<label class="field"><span>Code enseignant</span><input type="password" inputmode="numeric" autocomplete="off" data-pin></label>',
      onOk: function (root) {
        if (root.querySelector('[data-pin]').value !== String(APP.state.settings.pin || '')) {
          UI.toast('Code incorrect.', 'err'); return false;
        }
        var lid = K().lessonId;
        pending = null;
        APP.set(function (st) { st.kiosk = { on: false, lessonId: null, matchId: null, screen: 'home' }; });
        UI.fullscreen(false);
        location.hash = lid ? '#/lecon/' + lid + '/matchs' : '#/';
      }
    });
  }

  function go(screen, matchId) {
    pending = null;
    APP.set(function (st) { st.kiosk.screen = screen; if (matchId !== undefined) st.kiosk.matchId = matchId; });
    window.scrollTo(0, 0);
  }

  /* ---------- Écran de saisie ---------- */

  function actionButtons(m, side, player, small) {
    return m.actions.map(function (a) {
      var main = a.points > 0 ? '+' + a.points : (a.shot === 'missed' ? '✕' : '+0');
      return '<button class="act-btn' + (a.shot === 'missed' ? ' miss' : '') + (small ? ' sm' : '') + '" data-act="m.score" data-id="' + m.id + '" data-team="' + side + '" data-action="' + a.id + '"' + (player ? ' data-player="' + player + '"' : '') + '>' +
        '<b>' + main + '</b>' + (small && m.actions.length < 3 ? '' : '<span>' + esc(a.label) + '</span>') + '</button>';
    }).join('');
  }

  function playerRow(m, r, side, sid, where, teacher) {
    var s = APP.student(sid), p = r.players[sid];
    var pm = teacher && p ? '<span class="pm ' + (p.pmP > 0 ? 'pos' : p.pmP < 0 ? 'neg' : '') + '" title="Plus/malus">' + APP.signed(p.pmP, 0) + '</span>' : '';
    var btn = '';
    var pend = pending && pending.matchId === m.id && pending.team === side;
    if (m.ind.subs) {
      if (pend && pending.mode === 'in' && where === 'onfield') btn = '<button class="sub-btn choose" data-act="m.subPick" data-id="' + m.id + '" data-sid="' + sid + '">Sort</button>';
      else if (pend && pending.mode === 'out' && where === 'bench') btn = '<button class="sub-btn choose" data-act="m.subPick" data-id="' + m.id + '" data-sid="' + sid + '">Entre</button>';
      else if (where === 'onfield') btn = '<button class="sub-btn out" data-act="m.subOut" data-id="' + m.id + '" data-team="' + side + '" data-sid="' + sid + '">Sortir</button>';
      else btn = '<button class="sub-btn in" data-act="m.subIn" data-id="' + m.id + '" data-team="' + side + '" data-sid="' + sid + '">Entrer</button>';
    }
    var scoring = m.ind.scorers && where === 'onfield' ? '<div class="row-acts">' + actionButtons(m, side, sid, true) + '</div>' : '';
    var isPending = pend && pending.sid === sid;
    return '<div class="p-row ' + where + (isPending ? ' pending' : '') + '"><span class="p-name">' + esc(APP.name(s)) + pm + '</span>' + scoring + btn + '</div>';
  }

  function column(m, r, side, teacher) {
    var t = m.teams[side], c = UI.color(t.color);
    var onField = r.onField[side];
    var bench = t.members.filter(function (sid) { return onField.indexOf(sid) < 0; });
    var hasBall = m.ind.turnovers && r.possession === side;
    var last = ARENA.lastOf(m, side);
    var h = '<div class="col' + (hasBall ? ' ball' : '') + '" style="--tc:' + c.hex + ';--ti:' + UI.ink(c.hex) + '">';
    h += '<div class="col-head" data-act="m.poss" data-id="' + m.id + '" data-team="' + side + '"><span class="t-name">' + esc(t.name) + (hasBall ? ' <span class="ball-tag">ballon</span>' : '') + '</span><b class="t-score">' + r.score[side] + '</b></div>';

    if (pending && pending.matchId === m.id && pending.team === side) {
      h += '<div class="pend-bar">' + (pending.mode === 'in' ? 'Qui sort pour laisser entrer <b>' + esc(APP.sname(pending.sid)) + '</b> ?' : 'Qui entre à la place de <b>' + esc(APP.sname(pending.sid)) + '</b> ?') +
        (pending.mode === 'out' ? ' <button class="btn small" data-act="m.subNone" data-id="' + m.id + '">Personne</button>' : '') +
        ' <button class="btn small ghost" data-act="m.subCancel">Annuler</button></div>';
    }

    if (!m.ind.scorers) h += '<div class="acts n' + Math.min(m.actions.length, 5) + '">' + actionButtons(m, side, null, false) + '</div>';
    // Seule l'équipe qui a le ballon peut le perdre : le bouton n'apparaît
    // que de son côté, ce qui évite de le confondre avec un rebond.
    if (m.ind.turnovers && (hasBall || !r.possession)) h += '<button class="turn-btn" data-act="m.turnover" data-id="' + m.id + '" data-team="' + side + '">Perte de balle<small>interception, sortie, marcher, faute…</small></button>';

    if (m.ind.subs) {
      h += '<div class="p-group"><h4>Sur le terrain <span>' + onField.length + '/' + m.max + '</span></h4>' +
        onField.map(function (sid) { return playerRow(m, r, side, sid, 'onfield', teacher); }).join('') + '</div>';
      if (bench.length) h += '<div class="p-group bench"><h4>Remplaçants</h4>' + bench.map(function (sid) { return playerRow(m, r, side, sid, 'bench', teacher); }).join('') + '</div>';
    } else if (m.ind.scorers || teacher) {
      h += '<div class="p-group">' + t.members.map(function (sid) { return playerRow(m, r, side, sid, 'onfield', teacher); }).join('') + '</div>';
    }
    if (m.ind.scorers) h += '<div class="p-row onfield anon"><span class="p-name muted">On ne sait pas qui</span><div class="row-acts">' + actionButtons(m, side, null, true) + '</div></div>';

    h += '<button class="undo-btn" data-act="m.undo" data-id="' + m.id + '" data-team="' + side + '"' + (last ? '' : ' disabled') + '>' + UI.icon('undo', 18) + ' ' +
      (last ? 'Annuler : ' + esc(ARENA.describe(last.ev, m)) : 'Rien à annuler') + '</button>';
    return h + '</div>';
  }

  function reboundBtn(m, side, title, verb) {
    var c = UI.color(m.teams[side].color).hex;
    return '<button class="btn big reb" style="background:' + c + ';color:' + UI.ink(c) + '" data-act="m.rebound" data-id="' + m.id + '" data-team="' + side + '"><b>' + esc(m.teams[side].name) + '</b><small>' + title + ' : ' + verb + '</small></button>';
  }

  function settings(l) { return Object.assign({ report: true, atelier: true, end: true }, (l && l.kioskSet) || {}); }
  function canEnd(m) { return settings(APP.lesson(m.lessonId)).end; }
  function visible(m) { return m.onKiosk !== false; }

  function matchHTML(m, teacher) {
    var r = ARENA.replay(m);
    var el = ARENA.elapsed(m), target = (m.minutes || 0) * 60;
    var bg = '';
    if (m.ind.turnovers && r.possession) bg = ' style="background:' + UI.tint(UI.color(m.teams[r.possession].color).hex, 0.22) + '"';
    var h = '<div class="live' + (teacher ? ' teacher' : '') + '"' + bg + '>';
    h += '<div class="live-bar">' +
      (teacher ? '<a class="btn ghost" href="#/lecon/' + m.lessonId + '/matchs">' + UI.icon('back', 18) + ' Leçon</a>' : '<button class="btn ghost" data-act="k.home">' + UI.icon('back', 18) + ' Matchs</button>') +
      '<button class="clock' + (m.clock.running ? ' run' : '') + (target && el >= target ? ' over' : '') + '" data-act="m.clock" data-id="' + m.id + '"' + (m.status === 'done' ? ' disabled' : '') + '>' +
      UI.icon(m.clock.running ? 'pause' : 'play', 26) + '<span data-clock="' + m.id + '">' + APP.fmtTime(el) + '</span>' + (target ? '<small>/ ' + m.minutes + ' min</small>' : '') + '</button>' +
      (m.status === 'done' ? '<span class="done-tag">Match terminé</span>' : (teacher || canEnd(m) ? '<button class="btn" data-act="m.end" data-id="' + m.id + '">Terminer</button>' : '<span></span>')) +
      '</div>';
    if (m.ind.turnovers && !r.possession && m.status !== 'done') {
      h += '<div class="who-ball">Qui a le ballon en premier ? ' + ['A', 'B'].map(function (s) {
        return '<button class="btn big" style="background:' + UI.color(m.teams[s].color).hex + ';color:' + UI.ink(UI.color(m.teams[s].color).hex) + '" data-act="m.poss" data-id="' + m.id + '" data-team="' + s + '">' + esc(m.teams[s].name) + '</button>';
      }).join(' ') + '</div>';
    }
    if (m.ind.turnovers && r.awaitRebound && m.status !== 'done') {
      var shooter = r.awaitRebound, opp = ARENA.other(shooter);
      h += '<div class="rebound-bar"><span>Tir raté : qui récupère le ballon ?</span>' +
        reboundBtn(m, shooter, 'Rebond offensif', 'garde le ballon') + reboundBtn(m, opp, 'Rebond défensif', 'récupère le ballon') + '</div>';
    }
    if (m.status === 'ready' && !m.clock.running) h += '<p class="start-hint">Vérifiez qui commence sur le terrain, puis appuyez sur le chrono pour lancer le match.</p>';
    h += '<div class="cols">' + column(m, r, 'A', teacher) + column(m, r, 'B', teacher) + '</div></div>';
    return h;
  }

  /* ---------- Écrans du kiosque ---------- */

  // Les élèves ne créent rien : ils voient les matchs que tu as préparés et
  // rendus visibles sur la tablette, et c'est tout.
  function home(l) {
    var set = settings(l);
    var ms = APP.matchesOf(l.id).filter(visible);
    var open = ms.filter(function (m) { return m.status !== 'done'; });
    var done = ms.filter(function (m) { return m.status === 'done'; });
    var h = '<h1 class="k-title">' + (open.length ? 'Choisis ton match' : 'Pas de match pour l\'instant') + '</h1>';
    if (open.length) {
      h += '<div class="k-grid">' + open.map(function (m) {
        var r = ARENA.replay(m);
        return '<button class="k-card" data-act="k.open" data-id="' + m.id + '">' + UI.chip(m.teams.A) + '<b>' + r.score.A + ' – ' + r.score.B + '</b>' + UI.chip(m.teams.B) +
          '<small>' + (m.terrain ? 'Terrain ' + esc(m.terrain) + ' · ' : '') + (m.status === 'live' ? 'en cours' : 'à jouer') + '</small></button>';
      }).join('') + '</div>';
    } else {
      h += '<p class="empty">Ton professeur n\'a pas encore préparé de match sur cette tablette.</p>';
    }
    if (done.length && set.report) {
      h += '<h2 class="k-sub">Matchs terminés</h2><div class="k-list">' + done.map(function (m) {
        var r = ARENA.replay(m);
        return '<button class="k-line" data-act="k.report" data-id="' + m.id + '">' + UI.chip(m.teams.A) + ' <b>' + r.score.A + ' – ' + r.score.B + '</b> ' + UI.chip(m.teams.B) + '<em>Voir le bilan</em></button>';
      }).join('') + '</div>';
    }
    if (set.atelier && l.workshops && l.workshops.groups && l.workshops.groups.length) {
      h += '<button class="btn big k-atelier" data-act="k.atelier">Voir mon atelier</button>';
    }
    return h;
  }

  function atelier(l) {
    if (atelierSid) {
      var gi = TRAINING.groupOf(l, atelierSid);
      var sit = gi >= 0 ? TRAINING.situationFor(l, gi) : null;
      return '<button class="btn ghost" data-act="k.atelier">' + UI.icon('back', 18) + ' Autre élève</button>' +
        '<h1 class="k-title">' + esc(APP.sname(atelierSid)) + ' · ' + (gi >= 0 ? 'Atelier ' + (gi + 1) : 'pas d\'atelier') + '</h1>' +
        (gi >= 0 ? BANK.card(sit, { kiosk: true }) : '<p class="empty">Demande à ton professeur.</p>');
    }
    var ids = [];
    l.workshops.groups.forEach(function (g) { ids = ids.concat(g); });
    ids.sort(function (a, b) { return APP.byName(APP.student(a), APP.student(b)); });
    return '<button class="btn ghost" data-act="k.home">' + UI.icon('back', 18) + ' Matchs</button><h1 class="k-title">Touche ton prénom</h1>' +
      '<div class="att-grid">' + ids.map(function (sid) {
        return '<button class="att P" data-act="k.who" data-sid="' + sid + '"><b>' + esc(APP.student(sid).first) + '</b><span>' + esc(APP.student(sid).last) + '</span></button>';
      }).join('') + '</div>';
  }

  function render() {
    var k = K(), l = APP.lesson(k.lessonId);
    var top = '<div class="k-top"><span class="k-brand">Organisation CA4' + (l ? ' · Leçon ' + l.n : '') + '</span>' +
      '<span class="k-actions"><button class="icon-btn" data-act="k.full" aria-label="Plein écran">' + UI.icon('full', 20) + '</button>' +
      '<button class="btn k-quit" data-act="k.exit">' + UI.icon('lock', 18) + ' Quitter le kiosque</button></span></div>';
    if (!l) return top + '<p class="empty">Cette leçon n\'existe plus. Demande à ton professeur.</p>';
    var m = k.matchId && APP.match(k.matchId);
    var body;
    if (k.screen === 'match' && m) body = matchHTML(m, false);
    else if (k.screen === 'report' && m && settings(l).report) body = '<button class="btn ghost" data-act="k.home">' + UI.icon('back', 18) + ' Matchs</button>' + ARENA.reportHTML(m, { teacher: false });
    else if (k.screen === 'atelier' && l.workshops && settings(l).atelier) body = atelier(l);
    else body = home(l);
    return '<div class="kiosk">' + top + '<main class="k-main">' + body + '</main></div>';
  }

  // Appelé chaque demi-seconde : on ne met à jour que le texte du chrono,
  // sans tout redessiner, pour ne pas faire sauter l'écran sous les doigts.
  function tick() {
    var els = document.querySelectorAll('[data-clock]');
    for (var i = 0; i < els.length; i++) {
      var m = APP.match(els[i].getAttribute('data-clock'));
      if (!m) continue;
      var e = ARENA.elapsed(m);
      els[i].textContent = APP.fmtTime(e);
      var target = (m.minutes || 0) * 60;
      var over = target && e >= target;
      els[i].parentNode.classList.toggle('over', !!over);
      if (over && m.clock.running && !beeped[m.id]) { beeped[m.id] = true; UI.beep(3); }
    }
  }

  function M(el) { return APP.match(el.dataset.id); }
  function rec(el, fn) {
    var m = M(el);
    if (!m) return;
    if (m.status === 'done' && !document.querySelector('.live.teacher')) { UI.toast('Ce match est terminé.', 'err'); return; }
    APP.set(function () { fn(m); });
  }

  var acts = {
    'k.exit': askExit,
    'k.full': function () { UI.fullscreen(true); },
    'k.home': function () { atelierSid = null; go('home', null); },
    'k.open': function (el) { go('match', el.dataset.id); },
    'k.report': function (el) { go('report', el.dataset.id); },
    'k.atelier': function () { atelierSid = null; go('atelier'); },
    'k.who': function (el) { atelierSid = el.dataset.sid; APP.render(); window.scrollTo(0, 0); },

    'm.clock': function (el) {
      rec(el, function (m) { if (m.clock.running) ARENA.pauseClock(m); else ARENA.startClock(m); });
    },
    'm.score': function (el) {
      rec(el, function (m) { ARENA.score(m, el.dataset.team, el.dataset.action, el.dataset.player || null); });
    },
    'm.turnover': function (el) { rec(el, function (m) { ARENA.turnover(m, el.dataset.team); }); },
    'm.rebound': function (el) { rec(el, function (m) { ARENA.rebound(m, el.dataset.team); }); },
    'm.poss': function (el) {
      var m = M(el);
      if (!m || !m.ind.turnovers) return;
      var r = ARENA.replay(m);
      if (r.possession === el.dataset.team) return;
      rec(el, function (mm) { ARENA.setPossession(mm, el.dataset.team); });
    },
    'm.undo': function (el) {
      var removed = null;
      rec(el, function (m) { removed = ARENA.undo(m, el.dataset.team); });
      if (removed) UI.toast('Annulé : ' + ARENA.describe(removed, M(el)));
    },
    'm.subOut': function (el) {
      var m = M(el), side = el.dataset.team, r = ARENA.replay(m);
      var bench = m.teams[side].members.filter(function (s) { return r.onField[side].indexOf(s) < 0; });
      if (bench.length) { pending = { matchId: m.id, team: side, mode: 'out', sid: el.dataset.sid }; APP.render(); }
      else rec(el, function (mm) { ARENA.sub(mm, side, el.dataset.sid, null); });
    },
    'm.subIn': function (el) {
      var m = M(el), side = el.dataset.team, r = ARENA.replay(m);
      if (r.onField[side].length >= m.max) { pending = { matchId: m.id, team: side, mode: 'in', sid: el.dataset.sid }; APP.render(); }
      else rec(el, function (mm) { ARENA.sub(mm, side, null, el.dataset.sid); });
    },
    'm.subPick': function (el) {
      if (!pending) return;
      var p = pending; pending = null;
      rec(el, function (m) {
        if (p.mode === 'out') ARENA.sub(m, p.team, p.sid, el.dataset.sid);
        else ARENA.sub(m, p.team, el.dataset.sid, p.sid);
      });
    },
    'm.subNone': function (el) {
      if (!pending) return;
      var p = pending; pending = null;
      rec(el, function (m) { ARENA.sub(m, p.team, p.sid, null); });
    },
    'm.subCancel': function () { pending = null; APP.render(); },
    'm.end': function (el) {
      var m = M(el);
      UI.confirm('Terminer le match ? Le score ne pourra plus être modifié depuis la tablette.', function () {
        APP.set(function () { ARENA.finish(m); });
        if (K().on) go(settings(APP.lesson(m.lessonId)).report ? 'report' : 'home', m.id);
        else location.hash = '#/match/' + m.id + '/bilan';
      }, { okLabel: 'Terminer' });
    },
    'm.reopen': function (el) {
      APP.set(function () { var m = M(el); m.status = 'live'; });
      location.hash = '#/match/' + el.dataset.id;
    },
    'm.delEvent': function (el) {
      APP.set(function () { ARENA.removeEvent(M(el), el.dataset.ev); });
      UI.toast('Ligne supprimée, chiffres recalculés.');
    }
  };

  return { enter: enter, render: render, matchHTML: matchHTML, tick: tick, settings: settings, acts: acts, chgs: {} };
})();

</script>
<script>
/* js/views.js */
/*
 * Les écrans « enseignant » qui n'ont pas leur propre fichier : accueil,
 * classe, cycle (leçons, niveaux, statistiques, évaluation, réglages) et
 * match. Chaque écran est une fonction qui rend du HTML ; main.js se
 * charge de le placer dans la page et d'aiguiller les clics.
 */
var VIEWS = (function () {
  'use strict';
  var esc = APP.esc;
  var LEVELS = ['6e', '5e', '4e', '3e', '2de', '1re', 'Tle', 'Autre'];
  var route = { name: 'home', a: null, b: null, c: null };
  var sort = { key: 'level', dir: -1 };

  function setRoute(r) { route = r; }

  function shell(body) {
    var n = route.name;
    var on = function (x) { return n === x ? ' class="on"' : ''; };
    return '<header class="topbar"><a class="brand" href="#/"><span class="logo">CA4</span> Organisation CA4</a>' +
      '<nav><a href="#/"' + on('home') + '>Classes</a><a href="#/banque"' + on('banque') + '>Banque</a><a href="#/donnees"' + on('donnees') + '>Données</a></nav></header>' +
      '<main class="main">' + body + '</main>';
  }

  function render() {
    if (APP.state.kiosk.on) return KIOSK.render();
    var r = route, body;
    if (r.name === 'classe') body = classView(r.a);
    else if (r.name === 'cycle') body = cycleView(r.a, r.b);
    else if (r.name === 'lecon') { var l = APP.lesson(r.a); body = l ? LESSON.view(l, r.b) : notFound(); }
    else if (r.name === 'match') body = matchView(r.a, r.b);
    else if (r.name === 'eleve') body = DOSSIER.view(r.a, r.b);
    else if (r.name === 'banque') body = BANK.view();
    else if (r.name === 'donnees') body = CLOUD.view();
    else body = home();
    return shell(body);
  }

  function notFound() { return '<p class="empty">Cette page n\'existe plus. <a href="#/">Retour à l\'accueil</a></p>'; }

  /* ---------- Accueil ---------- */

  function home() {
    var st = APP.state;
    var h = '<div class="page-head"><div><h1>Mes classes</h1><p class="muted">' + esc(st.settings.school) + '</p></div>' +
      '<button class="btn primary" data-act="v.newClass">' + UI.icon('plus', 18) + ' Nouvelle classe</button></div>';
    if (!st.classes.length) {
      return h + '<section class="card welcome"><h2>Bienvenue</h2><ol><li><b>Importe ta classe</b> depuis un fichier CSV (Pronote, ENT ou tableur).</li>' +
        '<li><b>Crée un cycle</b> : basket, hand, foot, badminton…</li><li><b>Lance la leçon</b> : appel, équipes, matchs sur la tablette.</li></ol>' +
        '<div class="row-actions"><button class="btn primary big" data-act="v.newClass">Importer une classe</button><button class="btn big" data-act="v.demo">Essayer avec une classe exemple</button></div></section>';
    }
    h += '<div class="grid-cards">' + st.classes.map(function (k) {
      var cycles = st.cycles.filter(function (c) { return c.classId === k.id; });
      return '<section class="card class-card"><div class="card-head"><h2><a href="#/classe/' + k.id + '">' + esc(k.name) + '</a></h2><span class="muted">' + APP.plural(k.students.length, 'élève') + '</span></div>' +
        (cycles.length ? '<ul class="cycle-list">' + cycles.map(function (c) {
          var ls = APP.lessonsOf(c.id), last = ls[ls.length - 1];
          return '<li><a href="#/cycle/' + c.id + '"><b>' + esc(c.name) + '</b> <span class="muted">' + APP.plural(ls.length, 'leçon') + '</span></a>' +
            (last ? '<a class="btn small" href="#/lecon/' + last.id + '">Leçon ' + last.n + '</a>' : '') + '</li>';
        }).join('') + '</ul>' : '<p class="muted">Pas encore de cycle.</p>') +
        '<div class="row-actions"><button class="btn small primary" data-act="v.newCycle" data-id="' + k.id + '">' + UI.icon('plus', 16) + ' Cycle</button><a class="btn small ghost" href="#/classe/' + k.id + '">Élèves</a></div></section>';
    }).join('') + '</div>';
    return h;
  }

  function levelOptions(sel) {
    return LEVELS.map(function (l) { return '<option' + (l === sel ? ' selected' : '') + '>' + l + '</option>'; }).join('');
  }

  // Importe des élèves. Si le fichier contient une colonne « Classe » avec
  // plusieurs classes, on crée une classe par valeur : pratique quand on
  // exporte tout son service d'un coup depuis Pronote.
  function csvModal(klass) {
    var parsed = null;
    var body = (klass ? '' :
      '<label class="field"><span>Nom de la classe</span><input data-name placeholder="Ex. : 4e B"></label>' +
      '<label class="field inline"><span>Niveau</span><select data-level>' + levelOptions('4e') + '</select></label>') +
      '<div class="field"><span>Liste des élèves (CSV)</span><div class="row-actions"><button type="button" class="btn" data-file>Choisir un fichier…</button></div>' +
      '<textarea rows="6" data-csv placeholder="Nom;Prénom;Sexe&#10;DUPONT;Marie;F&#10;MARTIN;Lucas;G"></textarea></div>' +
      '<p class="hint">Colonnes reconnues : Nom, Prénom, Sexe (F/G, fille/garçon), ou une seule colonne « Élève » du type « DUPONT Marie ». Une colonne Niveau (1 à 4) sert d\'estimation de départ.</p><div data-prev class="preview"></div>';
    UI.modal({
      title: klass ? 'Ajouter des élèves à ' + klass.name : 'Nouvelle classe', okLabel: 'Importer', wide: true, body: body,
      onOpen: function (root) {
        var ta = root.querySelector('[data-csv]');
        var show = function () {
          parsed = APP.csv.toStudents(ta.value);
          var n = parsed.students.length, f = parsed.students.filter(function (s) { return s.sex === 'F'; }).length;
          var classes = {};
          parsed.students.forEach(function (s) { if (s.cls) classes[s.cls] = 1; });
          var multi = Object.keys(classes);
          root.querySelector('[data-prev]').innerHTML = n ? '<p><b>' + APP.plural(n, 'élève') + '</b> · ' + f + ' filles · ' + (n - f) + ' garçons' +
            (multi.length > 1 && !klass ? ' · ' + multi.length + ' classes : ' + esc(multi.join(', ')) : '') + '</p>' +
            parsed.warnings.map(function (w) { return '<p class="warn">' + esc(w) + '</p>'; }).join('') +
            '<p class="muted small">' + parsed.students.slice(0, 6).map(function (s) { return esc(s.first + ' ' + s.last) + (s.sex ? ' (' + s.sex + ')' : ''); }).join(', ') + (n > 6 ? '…' : '') + '</p>' : '';
          var nameIn = root.querySelector('[data-name]');
          if (nameIn && !nameIn.value && multi.length === 1) nameIn.value = multi[0];
        };
        ta.addEventListener('input', show);
        root.querySelector('[data-file]').addEventListener('click', function () {
          UI.pickFile('.csv,.txt,text/csv,text/plain', function (f) { APP.readTextFile(f, function (t) { ta.value = t; show(); }); });
        });
      },
      onOk: function (root) {
        parsed = APP.csv.toStudents(root.querySelector('[data-csv]').value);
        var list = parsed.students;
        var mk = function (s) { return { id: APP.uid('s'), first: s.first, last: s.last, sex: s.sex, photo: '', level: s.level }; };
        if (klass) {
          if (!list.length) { UI.toast('Aucun élève trouvé dans ce texte.', 'err'); return false; }
          APP.set(function () { var k = APP.cls(klass.id); list.forEach(function (s) { k.students.push(mk(s)); }); });
          UI.toast(APP.plural(list.length, 'élève') + ' ajouté' + (list.length > 1 ? 's' : '') + '.');
          return;
        }
        var nm = root.querySelector('[data-name]').value.trim(), lv = root.querySelector('[data-level]').value;
        if (!nm && !list.length) { UI.toast('Donne au moins un nom de classe.', 'err'); return false; }
        var seen = {};
        list.forEach(function (s) { if (s.cls) seen[s.cls] = 1; });
        var names = Object.keys(seen), groups = {};
        // Plusieurs classes dans le fichier : une classe par valeur, le nom
        // saisi ne sert pas. Sinon, tout va dans la classe nommée.
        if (names.length > 1) list.forEach(function (s) { var g = s.cls || nm || 'Sans classe'; (groups[g] = groups[g] || []).push(s); });
        else groups[nm || names[0] || 'Ma classe'] = list;
        var firstId = null;
        APP.set(function (st) {
          Object.keys(groups).forEach(function (g) {
            var k = { id: APP.uid('k'), name: g, level: guessLevel(g) || lv, students: groups[g].map(mk) };
            if (!firstId) firstId = k.id;
            st.classes.push(k);
          });
        });
        location.hash = '#/classe/' + firstId;
      }
    });
  }

  function guessLevel(name) {
    var m = String(name).match(/^\s*(6|5|4|3)\s*(e|è|eme|ème)?/i);
    if (m) return m[1] + 'e';
    if (/^\s*2/.test(name)) return '2de';
    if (/^\s*1/.test(name)) return '1re';
    if (/^\s*t/i.test(name)) return 'Tle';
    return null;
  }

  function newCycleModal(classId) {
    var st = APP.state;
    UI.modal({
      title: 'Nouveau cycle', okLabel: 'Créer et ouvrir la leçon 1',
      body: '<label class="field"><span>Classe</span><select data-k>' + st.classes.map(function (k) {
        return '<option value="' + k.id + '"' + (k.id === classId ? ' selected' : '') + '>' + esc(k.name) + '</option>';
      }).join('') + '</select></label>' +
        '<label class="field"><span>Activité</span><select data-sp>' + BANK.sportOptions('basket') + '</select></label>' +
        '<label class="field"><span>Nom du cycle</span><input data-nm placeholder="Basket-ball"></label>',
      onOk: function (root) {
        var kid = root.querySelector('[data-k]').value, sp = root.querySelector('[data-sp]').value;
        var k = APP.cls(kid), preset = BANK.sport(sp);
        var c = {
          id: APP.uid('c'), classId: kid, sport: sp, name: root.querySelector('[data-nm]').value.trim() || preset.label, created: Date.now(),
          indicators: LESSON.suggestIndicators(k.level), maxOnField: preset.max, matchMinutes: preset.minutes, prior: {}, override: {}, notes: {}
        };
        // Les niveaux fournis dans le CSV deviennent l'estimation de départ.
        k.students.forEach(function (s) { if (s.level) c.prior[s.id] = s.level; });
        var l;
        APP.setQuiet(function (s2) { s2.cycles.push(c); l = LESSON.create(c.id); LESSON.ensureMissed(l); s2.lessons.push(l); });
        location.hash = '#/lecon/' + l.id;
      }
    });
  }

  /* ---------- Classe ---------- */

  function classView(id) {
    var k = APP.cls(id);
    if (!k) return notFound();
    var ss = k.students.slice().sort(APP.byName);
    var f = ss.filter(function (s) { return s.sex === 'F'; }).length;
    var h = '<div class="page-head"><div><p class="crumbs"><a href="#/">Accueil</a></p><h1><input class="title-in" value="' + esc(k.name) + '" data-chg="v.className" data-id="' + k.id + '"></h1>' +
      '<p class="muted">' + APP.plural(ss.length, 'élève') + ' · ' + f + ' filles · ' + (ss.length - f) + ' garçons · niveau <select data-chg="v.classLevel" data-id="' + k.id + '">' + levelOptions(k.level) + '</select></p></div>' +
      '<div class="row-actions"><button class="btn" data-act="v.importInto" data-id="' + k.id + '">Importer (CSV)</button><button class="btn" data-act="v.addStudent" data-id="' + k.id + '">' + UI.icon('plus', 16) + ' Élève</button></div></div>';
    h += '<section class="card"><div class="table-wrap"><table class="tbl students"><thead><tr><th></th><th>Prénom</th><th>Nom</th><th>F/G</th><th></th></tr></thead><tbody>' +
      ss.map(function (s) {
        return '<tr><td><button class="mini-photo" data-act="d.photo" data-sid="' + s.id + '">' + (s.photo ? '<img src="' + s.photo + '" alt="">' : UI.icon('user', 18)) + '</button></td>' +
          '<td><input value="' + esc(s.first) + '" data-chg="v.stu" data-id="' + k.id + '" data-sid="' + s.id + '" data-f="first"></td>' +
          '<td><input value="' + esc(s.last) + '" data-chg="v.stu" data-id="' + k.id + '" data-sid="' + s.id + '" data-f="last"></td>' +
          '<td><select data-chg="v.stu" data-id="' + k.id + '" data-sid="' + s.id + '" data-f="sex" class="' + (s.sex ? '' : 'missing') + '"><option value="">?</option><option value="F"' + (s.sex === 'F' ? ' selected' : '') + '>F</option><option value="G"' + (s.sex === 'G' ? ' selected' : '') + '>G</option></select></td>' +
          '<td><button class="icon-btn" data-act="v.delStudent" data-id="' + k.id + '" data-sid="' + s.id + '" aria-label="Retirer">' + UI.icon('trash', 16) + '</button></td></tr>';
      }).join('') + '</tbody></table></div>' + (ss.length ? '' : '<p class="empty">Pas encore d\'élèves. Importe un fichier CSV ou ajoute-les un par un.</p>') + '</section>' +
      '<section class="card danger-zone"><button class="btn danger" data-act="v.delClass" data-id="' + k.id + '">Supprimer la classe</button> <span class="hint">Supprime aussi ses cycles, leçons et matchs.</span></section>';
    return h;
  }

  /* ---------- Cycle ---------- */

  function cycleView(id, tab) {
    var c = APP.cycle(id);
    if (!c) return notFound();
    var k = APP.cls(c.classId);
    tab = tab || 'lecons';
    var tabs = [['lecons', 'Leçons'], ['niveaux', 'Niveaux'], ['stats', 'Statistiques'], ['eval', 'Évaluation'], ['reglages', 'Réglages']];
    var h = '<div class="page-head"><div><p class="crumbs"><a href="#/">Accueil</a> › <a href="#/classe/' + k.id + '">' + esc(k.name) + '</a></p><h1>' + esc(c.name) + ' <small class="muted">' + esc(k.name) + '</small></h1></div>' +
      '<button class="btn primary" data-act="v.newLesson" data-id="' + c.id + '">' + UI.icon('plus', 18) + ' Nouvelle leçon</button></div>' +
      '<nav class="tabs">' + tabs.map(function (t) { return '<a href="#/cycle/' + c.id + '/' + t[0] + '" class="' + (t[0] === tab ? 'on' : '') + '">' + t[1] + '</a>'; }).join('') + '</nav>';
    if (tab === 'niveaux') return h + levelsTab(c);
    if (tab === 'stats') return h + statsTab(c);
    if (tab === 'eval') return h + EVAL.view(c);
    if (tab === 'reglages') return h + settingsTab(c);
    return h + lessonsTab(c);
  }

  function lessonsTab(c) {
    var ls = APP.lessonsOf(c.id);
    if (!ls.length) return '<p class="empty">Pas encore de leçon. Touche « Nouvelle leçon ».</p>';
    var ss = APP.studentsOfCycle(c.id);
    return '<div class="lesson-list">' + ls.slice().reverse().map(function (l) {
      var p = ss.filter(function (s) { return LESSON.status(l, s.id) === 'P'; }).length;
      var ms = APP.matchesOf(l.id);
      return '<a class="card lesson-card" href="#/lecon/' + l.id + '"><b>Leçon ' + l.n + '</b><span>' + APP.fmtDate(l.date) + '</span>' +
        '<span class="muted">' + p + '/' + ss.length + ' présents · ' + APP.plural(l.teams.length, 'équipe') + ' · ' + APP.plural(ms.length, 'match', 'matchs') + '</span>' +
        '<span class="teams-dots">' + l.teams.map(function (t) { return UI.dot(t.color, 12); }).join('') + '</span>' +
        '<button class="icon-btn" data-act="v.delLesson" data-id="' + l.id + '" aria-label="Supprimer la leçon">' + UI.icon('trash', 16) + '</button></a>';
    }).join('') + '</div>';
  }

  function levelsTab(c) {
    var lv = RATINGS.compute(c.id);
    var ss = APP.studentsOfCycle(c.id).sort(function (a, b) { return lv[b.id].level - lv[a.id].level; });
    var dist = [0, 0, 0, 0];
    ss.forEach(function (s) { if (lv[s.id].known) dist[RATINGS.info(lv[s.id].level).n - 1]++; });
    var h = '<section class="card"><h3>Répartition</h3><div class="dist">' + RATINGS.LEVELS.map(function (L, i) {
      return '<div class="dist-col"><i style="height:' + (8 + 90 * dist[i] / Math.max(1, ss.length)) + 'px;background:' + L.color + '"></i><b>' + dist[i] + '</b><span>' + L.short + '</span></div>';
    }).join('') + '</div>' +
      '<details class="explain"><summary>Comment le niveau est-il calculé ?</summary><p>Quand un élève est sur le terrain, chaque point marqué par son équipe lui rapporte (+), chaque point encaissé lui coûte (−). Les remplaçants ne sont pas concernés. On ramène ce total à son temps de jeu, puis on le compare au reste de la classe pour le placer entre 1 et 4.</p>' +
      '<p>Le niveau est donné sur 10 : 5/10 correspond au milieu de la classe. Au début du cycle, c\'est ton estimation de départ qui compte (ou 5/10 si tu n\'en donnes pas). Plus l\'élève joue, plus le terrain prend le dessus : à 12 minutes de jeu, moitié-moitié. Tu peux toujours fixer un niveau à la main.</p></details></section>';
    h += '<section class="card"><div class="table-wrap"><table class="tbl"><thead><tr><th>Élève</th><th>Niveau /10</th><th>D\'où il vient</th><th>Temps de jeu</th><th>Départ</th><th>Fixer</th></tr></thead><tbody>' +
      ss.map(function (s) {
        var r = lv[s.id];
        return '<tr><td><a href="#/eleve/' + c.id + '/' + s.id + '">' + esc(APP.name(s, true)) + '</a></td><td>' + RATINGS.badge(r.level, r.known) + ' <small>' + (r.known ? RATINGS.info(r.level).short : '') + '</small></td>' +
          '<td class="small muted">' + RATINGS.sourceLabel(r.source) + '</td><td>' + APP.fmtMin(r.sec) + '</td>' +
          '<td>' + DOSSIER.levelSelect('d.prior', c, s.id, r.prior, '?') + '</td><td>' + DOSSIER.levelSelect('d.override', c, s.id, r.override, 'auto') + '</td></tr>';
      }).join('') + '</tbody></table></div></section>';
    return h;
  }

  function statsTab(c) {
    var lv = RATINGS.compute(c.id);
    var ss = APP.studentsOfCycle(c.id);
    var ms = APP.matchesOfCycle(c.id).filter(function (m) { return m.events.length; });
    var byLesson = PROGRESS.levelsByLesson(c.id);
    var totalSec = APP.sum(ms.map(function (m) { return ARENA.replay(m).end; }));
    var known = ss.filter(function (s) { return lv[s.id].known; });
    var cols = [
      ['name', 'Élève'], ['level', 'Niveau /10'], ['sec', 'Temps de jeu'], ['matches', 'Matchs'], ['wins', 'Gagnés'],
      ['pts', 'Points'], ['shots', 'Tirs'], ['pmU', '+/− (unités)'], ['per5', '+/− par 5 min']
    ];
    var val = function (s, k) {
      var r = lv[s.id];
      if (k === 'name') return s.first + ' ' + s.last;
      if (k === 'shots') return r.made + r.missed ? r.made / (r.made + r.missed) : -1;
      if (k === 'per5') return r.per5 == null ? -999 : r.per5;
      if (k === 'level') return r.known ? r.level : -1;
      return r[k];
    };
    var sorted = ss.slice().sort(function (a, b) {
      var x = val(a, sort.key), y = val(b, sort.key);
      return (typeof x === 'string' ? x.localeCompare(y, 'fr') : x - y) * sort.dir;
    });
    var h = '<div class="tiles">' +
      '<div class="tile"><b>' + ms.length + '</b><span>matchs joués</span></div>' +
      '<div class="tile"><b>' + APP.fmtMin(totalSec) + '</b><span>de jeu au total</span></div>' +
      '<div class="tile"><b>' + (known.length ? RATINGS.fmt(APP.mean(known.map(function (s) { return lv[s.id].level; }))) + '<small>/10</small>' : '–') + '</b><span>niveau moyen de la classe</span></div>' +
      '<div class="tile"><b>' + byLesson.length + '</b><span>leçons</span></div></div>';
    if (byLesson.length > 1) {
      h += '<section class="card"><h3>Niveau moyen de la classe (sur 10)</h3>' + UI.lineChart([{ color: '#0f766e', pts: PROGRESS.classSeries(c.id, byLesson).map(RATINGS.to10) }], { yMin: 0, yMax: 10, step: 2, labels: byLesson.map(function (x) { return 'L' + x.lesson.n; }) }) + '</section>';
    }
    h += '<section class="card"><div class="card-head"><h3>Tous les élèves</h3><button class="btn small" data-act="cl.stats" data-id="' + c.id + '">Exporter (tableur)</button></div>' +
      '<p class="hint">Touche un titre de colonne pour trier. Touche un élève pour voir sa fiche. Le plus/malus est compté en unités (1 = un point « normal ») pour pouvoir additionner des leçons aux barèmes différents.</p>' +
      '<div class="table-wrap"><table class="tbl sortable"><thead><tr>' + cols.map(function (col) {
        return '<th><button class="th-sort' + (sort.key === col[0] ? ' on' : '') + '" data-act="v.sort" data-k="' + col[0] + '">' + col[1] + (sort.key === col[0] ? (sort.dir > 0 ? ' ▲' : ' ▼') : '') + '</button></th>';
      }).join('') + '</tr></thead><tbody>' +
      sorted.map(function (s) {
        var r = lv[s.id], sh = r.made + r.missed;
        return '<tr><td><a href="#/eleve/' + c.id + '/' + s.id + '">' + esc(APP.name(s, true)) + '</a></td><td>' + RATINGS.badge(r.level, r.known) + '</td><td>' + APP.fmtMin(r.sec) + '</td>' +
          '<td>' + r.matches + '</td><td>' + r.wins + '</td><td>' + r.pts + '</td><td>' + (sh ? r.made + '/' + sh : '–') + '</td>' +
          '<td class="' + (r.pmU > 0 ? 'pos' : r.pmU < 0 ? 'neg' : '') + '">' + APP.signed(r.pmU, 1) + '</td><td>' + APP.signed(r.per5) + '</td></tr>';
      }).join('') + '</tbody></table></div></section>';
    h += '<section class="card"><h3>Tous les matchs du cycle</h3>' + (ms.length ? '<ul class="match-list">' + ms.map(function (m) {
      var r = ARENA.replay(m), l = APP.lesson(m.lessonId);
      return '<li><span class="muted">L' + (l ? l.n : '?') + '</span><a href="#/match/' + m.id + '/bilan">' + UI.chip(m.teams.A) + ' <b>' + r.score.A + ' – ' + r.score.B + '</b> ' + UI.chip(m.teams.B) + '</a><span class="muted small">' + APP.fmtTime(r.end) + '</span></li>';
    }).join('') + '</ul>' : '<p class="muted">Pas encore de match.</p>') + '</section>';
    return h;
  }

  function settingsTab(c) {
    return '<section class="card"><h3>Cycle</h3>' +
      '<label class="field"><span>Nom</span><input value="' + esc(c.name) + '" data-chg="v.cycleName" data-id="' + c.id + '"></label>' +
      '<label class="field"><span>Activité</span><select data-chg="v.cycleSport" data-id="' + c.id + '">' + BANK.sportOptions(c.sport) + '</select></label>' +
      '<p class="hint">Les règles (barème, indicateurs, joueurs sur le terrain) se règlent leçon par leçon, dans l\'onglet « Règles » de chaque leçon. Une nouvelle leçon reprend les règles de la précédente.</p></section>' +
      '<section class="card danger-zone"><button class="btn danger" data-act="v.delCycle" data-id="' + c.id + '">Supprimer le cycle</button> <span class="hint">Supprime ses leçons et ses matchs.</span></section>';
  }

  /* ---------- Match (enseignant) ---------- */

  function matchView(id, tab) {
    var m = APP.match(id);
    if (!m) return notFound();
    var l = APP.lesson(m.lessonId);
    tab = tab || (m.status === 'done' ? 'bilan' : 'saisie');
    var h = '<nav class="tabs"><a href="#/lecon/' + m.lessonId + '/matchs">← Leçon ' + (l ? l.n : '') + '</a>' +
      '<a href="#/match/' + m.id + '/saisie" class="' + (tab === 'saisie' ? 'on' : '') + '">Saisie</a><a href="#/match/' + m.id + '/bilan" class="' + (tab === 'bilan' ? 'on' : '') + '">Bilan</a></nav>';
    if (tab === 'bilan') {
      return h + (m.status === 'done' ? '<p class="row-actions"><button class="btn small ghost" data-act="m.reopen" data-id="' + m.id + '">Rouvrir le match</button></p>' : '') + ARENA.reportHTML(m, { teacher: true });
    }
    return h + KIOSK.matchHTML(m, true);
  }

  /* ---------- Actions ---------- */

  function deleteCycleData(st, cycleId) {
    var lids = st.lessons.filter(function (l) { return l.cycleId === cycleId; }).map(function (l) { return l.id; });
    st.matches = st.matches.filter(function (m) { return lids.indexOf(m.lessonId) < 0; });
    st.lessons = st.lessons.filter(function (l) { return l.cycleId !== cycleId; });
    st.cycles = st.cycles.filter(function (c) { return c.id !== cycleId; });
  }

  var acts = {
    'v.newClass': function () { csvModal(null); },
    'v.importInto': function (el) { csvModal(APP.cls(el.dataset.id)); },
    'v.newCycle': function (el) { newCycleModal(el.dataset.id); },
    'v.demo': function () { MAIN.demo(); },
    'v.addStudent': function (el) {
      APP.set(function () { APP.cls(el.dataset.id).students.push({ id: APP.uid('s'), first: 'Nouvel', last: 'Élève', sex: '', photo: '' }); });
    },
    'v.delStudent': function (el) {
      var s = APP.student(el.dataset.sid);
      UI.confirm('Retirer ' + APP.name(s, true) + ' de la classe ? Ses matchs restent comptés pour les autres.', function () {
        APP.set(function () { var k = APP.cls(el.dataset.id); k.students = k.students.filter(function (x) { return x.id !== s.id; }); });
      }, { danger: true, okLabel: 'Retirer' });
    },
    'v.delClass': function (el) {
      var k = APP.cls(el.dataset.id);
      UI.confirm('Supprimer la classe ' + k.name + ' et tout son suivi ?', function () {
        APP.set(function (st) {
          st.cycles.filter(function (c) { return c.classId === k.id; }).forEach(function (c) { deleteCycleData(st, c.id); });
          st.classes = st.classes.filter(function (x) { return x.id !== k.id; });
        });
        location.hash = '#/';
      }, { danger: true, okLabel: 'Supprimer' });
    },
    'v.newLesson': function (el) {
      var l;
      APP.setQuiet(function (st) { l = LESSON.create(el.dataset.id); LESSON.ensureMissed(l); st.lessons.push(l); });
      location.hash = '#/lecon/' + l.id;
    },
    'v.delLesson': function (el, ev) {
      ev.preventDefault(); ev.stopPropagation();
      var l = APP.lesson(el.dataset.id);
      UI.confirm('Supprimer la leçon ' + l.n + ' et ses matchs ?', function () {
        APP.set(function (st) {
          st.matches = st.matches.filter(function (m) { return m.lessonId !== l.id; });
          st.lessons = st.lessons.filter(function (x) { return x.id !== l.id; });
        });
      }, { danger: true, okLabel: 'Supprimer' });
    },
    'v.delCycle': function (el) {
      UI.confirm('Supprimer ce cycle, ses leçons et ses matchs ?', function () {
        var kid = APP.cycle(el.dataset.id).classId;
        APP.set(function (st) { deleteCycleData(st, el.dataset.id); });
        location.hash = '#/classe/' + kid;
      }, { danger: true, okLabel: 'Supprimer' });
    },
    'v.sort': function (el) {
      var k = el.dataset.k;
      sort = { key: k, dir: sort.key === k ? -sort.dir : (k === 'name' ? 1 : -1) };
      APP.render();
    }
  };

  var chgs = {
    'v.className': function (el, ev) {
      var fn = function () { APP.cls(el.dataset.id).name = el.value.trim() || 'Classe'; };
      if (ev.type === 'input') APP.setQuiet(fn); else APP.set(fn);
    },
    'v.classLevel': function (el) { APP.set(function () { APP.cls(el.dataset.id).level = el.value; }); },
    'v.stu': function (el, ev) {
      var fn = function () { var s = APP.byId(APP.cls(el.dataset.id).students, el.dataset.sid); s[el.dataset.f] = el.value.trim(); };
      if (ev.type === 'input') APP.setQuiet(fn); else APP.set(fn);
    },
    'v.cycleName': function (el, ev) {
      var fn = function () { APP.cycle(el.dataset.id).name = el.value.trim() || 'Cycle'; };
      if (ev.type === 'input') APP.setQuiet(fn); else APP.set(fn);
    },
    'v.cycleSport': function (el) { APP.set(function () { APP.cycle(el.dataset.id).sport = el.value; }); }
  };

  return { render: render, setRoute: setRoute, get route() { return route; }, guessLevel: guessLevel, acts: acts, chgs: chgs };
})();

</script>
<script>
/* js/main.js */
/*
 * Point de départ : charge les données, lit l'adresse (#/lecon/…), place
 * l'écran dans la page et aiguille tous les clics et saisies vers le bon
 * module grâce aux attributs data-act et data-chg. Un seul écouteur par
 * type d'événement : rien à rebrancher quand l'écran est redessiné.
 */
var MAIN = (function () {
  'use strict';

  var MODULES = [UI, RATINGS, TEAMS, PROGRESS, CLOUD, VIEWS, BANK, TRAINING, EVAL, ARENA, DOSSIER, LESSON, KIOSK];
  var handlers = {}, changers = {};

  function collect() {
    MODULES.forEach(function (mod) {
      Object.keys(mod.acts || {}).forEach(function (k) { handlers[k] = mod.acts[k]; });
      Object.keys(mod.chgs || {}).forEach(function (k) { changers[k] = mod.chgs[k]; });
    });
  }

  function parseHash() {
    var parts = (location.hash || '#/').replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
    return { name: parts[0] || 'home', a: parts[1] || null, b: parts[2] || null, c: parts[3] || null };
  }

  // Clé qui permet de retrouver le même champ après avoir redessiné l'écran,
  // pour que la touche Tab ou un clic dans le champ suivant ne soient pas perdus.
  var KEYS = ['data-chg', 'data-act', 'data-id', 'data-sid', 'data-f', 'data-a', 'data-c', 'data-k', 'data-g'];
  function focusKey(el) {
    if (!el || el === document.body || !el.getAttribute) return null;
    var sel = KEYS.filter(function (k) { return el.hasAttribute(k); }).map(function (k) {
      return '[' + k + '="' + String(el.getAttribute(k)).replace(/"/g, '\\"') + '"]';
    }).join('');
    return sel ? el.tagName.toLowerCase() + sel : null;
  }

  // Le dessin est regroupé à la prochaine image : plusieurs enregistrements
  // d'affilée ne coûtent qu'un seul dessin, et le focus a eu le temps de
  // passer au champ suivant avant qu'on le restaure.
  var queued = false;
  function draw() {
    queued = false;
    var app = document.getElementById('app');
    var active = document.activeElement;
    var key = app.contains(active) ? focusKey(active) : null;
    var selStart = null;
    try { selStart = active && active.selectionStart; } catch (e) { selStart = null; }
    document.body.classList.toggle('kiosk-on', !!APP.state.kiosk.on);
    app.innerHTML = VIEWS.render();
    if (key && app.contains(active) === false) {
      var again = app.querySelector(key);
      if (again && again.focus) {
        again.focus({ preventScroll: true });
        try { if (selStart != null && again.setSelectionRange) again.setSelectionRange(selStart, selStart); } catch (e) { /* champs sans curseur */ }
      }
    }
    KIOSK.tick();
  }
  function schedule() {
    if (queued) return;
    queued = true;
    (window.requestAnimationFrame || setTimeout)(draw);
  }

  function onClick(ev) {
    var el = ev.target.closest && ev.target.closest('[data-act]');
    if (!el || el.disabled) return;
    var fn = handlers[el.getAttribute('data-act')];
    if (!fn) return;
    ev.preventDefault();
    try { fn(el, ev); } catch (e) { report(e); }
  }

  var NO_INPUT = /^(checkbox|radio|file|select-one|select-multiple)$/;
  function onChange(ev) {
    var el = ev.target.closest && ev.target.closest('[data-chg]');
    if (!el) return;
    // Les cases, listes et fichiers envoient aussi « input » : on ne traite
    // que « change », sinon l'action partirait deux fois.
    if (ev.type === 'input' && NO_INPUT.test(el.type)) return;
    var fn = changers[el.getAttribute('data-chg')];
    if (!fn) return;
    try { fn(el, ev); } catch (e) { report(e); }
  }

  function report(e) {
    if (window.console) console.error(e);
    UI.toast('Oups, quelque chose n\'a pas marché. Recharge la page si ça continue.', 'err');
  }

  function registerOffline() {
    if (!/^https?:$/.test(location.protocol)) return;
    // Le manifeste n'est ajouté que sur un vrai site : ouvert depuis un
    // fichier, le navigateur le refuserait avec une erreur inutile.
    var link = document.createElement('link');
    link.rel = 'manifest'; link.href = 'manifest.webmanifest';
    document.head.appendChild(link);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () { /* hors ligne impossible, l'appli marche quand même */ });
  }

  /* ---------- Classe exemple ---------- */

  var GIRLS = ['Inès', 'Léa', 'Chloé', 'Aya', 'Manon', 'Jade', 'Sarah', 'Lina', 'Emma', 'Maëlys', 'Nour', 'Camille'];
  var BOYS = ['Adam', 'Lucas', 'Yanis', 'Noah', 'Mohamed', 'Hugo', 'Ethan', 'Rayan', 'Théo', 'Sofiane', 'Nathan', 'Ilyes'];
  var LAST = ['Martin', 'Bernard', 'Diallo', 'Petit', 'Benali', 'Durand', 'Nguyen', 'Moreau', 'Traoré', 'Laurent', 'Haddad', 'Simon', 'Michel', 'Garcia', 'Lefebvre', 'Kone', 'Roux', 'Fontaine', 'Mendes', 'Girard', 'Bonnet', 'Mercier', 'Blanc', 'Chevalier'];

  function rng(seed) {
    return function () { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  }

  // Match simulé : chaque élève a un « vrai » niveau caché, et l'équipe la
  // plus forte sur le terrain marque plus souvent. Ça permet de voir tout
  // de suite comment l'appli fait émerger les niveaux.
  function simulate(m, skill, rnd) {
    var dur = m.minutes * 60, t = 0, on = { A: m.lineup.A.slice(), B: m.lineup.B.slice() }, poss = 'A', nextSub = 60;
    var made = m.actions.filter(function (a) { return a.shot === 'made'; });
    var miss = m.actions.filter(function (a) { return a.shot === 'missed'; })[0];
    var ev = function (o) { o.id = APP.uid('e'); o.t = Math.round(t * 10) / 10; m.events.push(o); };
    if (m.ind.turnovers) ev({ type: 'poss', team: 'A' });
    while (true) {
      t += 6 + rnd() * 12;
      if (t >= dur) break;
      if (t > nextSub && m.ind.subs) {
        nextSub += 60 + rnd() * 30;
        ['A', 'B'].forEach(function (s) {
          var bench = m.teams[s].members.filter(function (x) { return on[s].indexOf(x) < 0; });
          if (!bench.length) return;
          var out = on[s][Math.floor(rnd() * on[s].length)], inn = bench[Math.floor(rnd() * bench.length)];
          on[s] = on[s].filter(function (x) { return x !== out; }).concat([inn]);
          ev({ type: 'sub', team: s, out: out, 'in': inn });
        });
      }
      var str = function (s) { return on[s].reduce(function (a, x) { return a + Math.pow(skill[x], 2); }, 0); };
      var pA = str('A') / (str('A') + str('B'));
      var att = poss, winChance = att === 'A' ? pA : 1 - pA;
      var r = rnd();
      if (r < 0.6 * winChance + 0.12) {
        var a = made.length > 1 && rnd() < 0.15 ? made[made.length - 1] : made[0];
        var pl = on[att][Math.floor(rnd() * on[att].length)];
        ev({ type: 'score', team: att, actionId: a.id, label: a.label, points: a.points, units: a.units, shot: 'made', player: m.ind.scorers ? pl : null });
        poss = att === 'A' ? 'B' : 'A';
      } else if (miss && r < 0.75) {
        ev({ type: 'score', team: att, actionId: miss.id, label: miss.label, points: miss.points, units: miss.units, shot: 'missed', player: m.ind.scorers ? on[att][Math.floor(rnd() * on[att].length)] : null });
        t += 1;
        if (rnd() < 0.3) ev({ type: 'rebound', team: att });
        else { poss = att === 'A' ? 'B' : 'A'; ev({ type: 'rebound', team: poss }); }
      } else if (m.ind.turnovers) {
        ev({ type: 'turnover', team: att });
        poss = att === 'A' ? 'B' : 'A';
      } else {
        poss = att === 'A' ? 'B' : 'A';
      }
    }
    m.clock = { running: false, base: dur, since: 0 };
    m.status = 'done';
    m.ended = Date.now();
  }

  function demo() {
    var rnd = rng(20260926);
    var skill = {};
    var students = [];
    GIRLS.forEach(function (f, i) { students.push({ id: APP.uid('s'), first: f, last: LAST[i], sex: 'F', photo: '' }); });
    BOYS.forEach(function (f, i) { students.push({ id: APP.uid('s'), first: f, last: LAST[i + 12], sex: 'G', photo: '' }); });
    students.forEach(function (s) { skill[s.id] = 1 + rnd() * 3; });
    var k = { id: APP.uid('k'), name: '5e Démo', level: '5e', students: students };
    var c = { id: APP.uid('c'), classId: k.id, sport: 'basket', name: 'Basket-ball', created: Date.now(), indicators: { subs: true, scorers: true, turnovers: true, shots: true }, maxOnField: 4, matchMinutes: 6, prior: {}, override: {}, notes: {} };
    APP.setQuiet(function (st) { st.classes.push(k); st.cycles.push(c); });

    for (var n = 1; n <= 2; n++) {
      var l = LESSON.create(c.id);
      var d = new Date();
      d.setDate(d.getDate() - 7 * (2 - n));
      l.date = d.toISOString().slice(0, 10);
      if (n === 2) {
        // Leçon 2 : barème bonifié, pour voir comment l'appli fait le lien
        // avec la leçon 1 où tous les paniers valaient 2.
        l.actions = [
          { id: APP.uid('a'), label: 'Panier', points: 10, shot: 'made', units: 1, autoUnits: true },
          { id: APP.uid('a'), label: 'Panier sans défenseur', points: 100, shot: 'made', units: 1, autoUnits: true },
          { id: APP.uid('a'), label: 'Cerceau touché', points: 1, shot: 'missed', units: 1, autoUnits: true }
        ];
        RATINGS.refreshUnits(l.actions);
        l.actions = BANK.sortActions(l.actions);
      }
      LESSON.ensureMissed(l);
      if (n === 2) l.attendance[students[3].id] = 'A';
      APP.setQuiet(function (st) { st.lessons.push(l); });
      if (n === 2) LESSON.setStatus(l, students[20].id, 'B');
      LESSON.applyComposition(l, { count: 4, level: 'equilibre', mix: 'mixte', strongMore: true });
      l.schedule = ARENA.roundRobin(l.teams.map(function (t) { return t.id; }), 2);
      var ms = [];
      l.schedule.forEach(function (r) {
        r.games.forEach(function (g) {
          var m = ARENA.create(l, g.a, g.b, String(g.terrain));
          simulate(m, skill, rnd);
          g.matchId = m.id;
          ms.push(m);
        });
      });
      APP.setQuiet(function (st) { st.matches = st.matches.concat(ms); });
    }
    APP.save();
    location.hash = '#/cycle/' + c.id;
    APP.render();
    UI.toast('Classe exemple créée : 2 leçons et 12 matchs simulés.');
  }

  // Les activités de duel ont été retirées : on enlève leurs situations
  // d'exemple et on range un éventuel cycle existant dans « autre sport ».
  function migrate(st) {
    var before = st.bank.length;
    st.bank = st.bank.filter(function (s) { return !/^sit-(badminton|tennistable|boxe)-/.test(s.id); });
    var changed = before !== st.bank.length;
    st.cycles.forEach(function (c) { if (!BANK.SPORTS[c.sport]) { c.sport = 'autre'; changed = true; } });
    if (changed) APP.save();
  }

  function start() {
    APP.load();
    if (!APP.state.bank.length) { APP.state.bank = BANK.defaults(); APP.save(); }
    migrate(APP.state);
    // Porte de secours documentée dans le README : si le code du kiosque
    // est oublié, on peut en sortir en ajoutant ?sortie-kiosque à l'adresse.
    if (/[?&]sortie-kiosque/.test(location.search)) { APP.state.kiosk.on = false; APP.save(); }
    collect();
    APP.onRender(schedule);
    VIEWS.setRoute(parseHash());
    window.addEventListener('hashchange', function () {
      VIEWS.setRoute(parseHash());
      draw();
      if (!APP.state.kiosk.on) window.scrollTo(0, 0);
    });
    document.addEventListener('click', onClick);
    document.addEventListener('change', onChange);
    document.addEventListener('input', onChange);
    setInterval(KIOSK.tick, 500);
    registerOffline();
    if (!APP.storageOk) UI.toast('Attention : ce navigateur n\'enregistre rien. Fais des sauvegardes.', 'err');
    draw();
  }

  return { start: start, demo: demo, simulate: simulate, parseHash: parseHash, handlers: handlers, changers: changers };
})();

if (typeof document !== 'undefined' && document.getElementById && document.getElementById('app')) {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', MAIN.start);
  else MAIN.start();
}

</script>
</body>
</html>
