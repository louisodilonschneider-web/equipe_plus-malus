<title>Organisation CA4</title>

<style>
/*
 * Organisation CA4 — feuille de style unique.
 * Fond clair et épuré, une seule couleur d'accent (vert d'eau) pour ne pas
 * concurrencer les couleurs des chasubles, qui doivent rester les seules
 * couleurs vives de l'écran.
 */
:root {
  --bg: #f6f8fa;
  --card: #ffffff;
  --ink: #1f2937;
  --muted: #6b7280;
  --line: #e5e7eb;
  --soft: #f1f5f4;
  --accent: #0f766e;
  --accent-soft: #e3f2ef;
  --ok: #15803d;  --ok-bg: #dcfce7;
  --abs: #dc2626; --abs-bg: #fee2e2;
  --inj: #ea580c; --inj-bg: #ffedd5;
  --pos: #15803d; --neg: #dc2626;
  --r: 12px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .05);
  /* La taille du texte suit la largeur de l'écran : lisible sur téléphone,
     pas perdue au milieu d'un grand écran d'ordinateur ou d'un TBI. */
  font-size: clamp(15px, 12px + .35vw, 19px);
  --gutter: clamp(.75rem, 2.2vw, 2rem);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  line-height: 1.45; -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { margin: 0 0 .5rem; line-height: 1.2; }
h1 { font-size: 1.6rem; }
h1 small { font-size: 1rem; font-weight: 400; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.05rem; }
h4 { font-size: .95rem; }
p { margin: .4rem 0; }
input, select, textarea, button { font: inherit; color: inherit; }
input, select, textarea {
  border: 1px solid var(--line); border-radius: 8px; padding: .45rem .6rem; background: #fff; max-width: 100%;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
textarea { width: 100%; resize: vertical; }
button { cursor: pointer; }
button:focus:not(:focus-visible) { outline: none; }
.loading { padding: 3rem; text-align: center; color: var(--muted); }
.muted { color: var(--muted); }
.small, small { font-size: .85rem; }
.center { text-align: center; }
.hint { color: var(--muted); font-size: .9rem; }
.warn { color: var(--inj); font-weight: 500; }
.empty { padding: 1.5rem; text-align: center; color: var(--muted); background: var(--card); border-radius: var(--r); border: 1px dashed var(--line); }
.pos { color: var(--pos); font-weight: 600; }
.neg { color: var(--neg); font-weight: 600; }
ul.plain { list-style: none; padding: 0; margin: .5rem 0; }
ul.plain li { padding: .15rem 0; }

/* ---------- Structure ---------- */
.topbar {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  padding: .6rem var(--gutter); background: rgba(255, 255, 255, .92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: .55rem; font-weight: 700; color: var(--ink); }
.brand:hover { text-decoration: none; }
.logo { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: #fff; font-size: .78rem; letter-spacing: .02em; }
.topbar nav { display: flex; gap: .25rem; }
.topbar nav a { padding: .45rem .8rem; border-radius: 8px; color: var(--muted); font-weight: 500; }
.topbar nav a.on, .topbar nav a:hover { background: var(--accent-soft); color: var(--accent); text-decoration: none; }
.main { width: 100%; max-width: 1760px; margin: 0 auto; padding: 1.1rem var(--gutter) 2rem; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
.crumbs { margin: 0 0 .2rem; font-size: .88rem; color: var(--muted); }
.title-in { font-size: 1.5rem; font-weight: 700; border-color: transparent; padding: .1rem .3rem; margin-left: -.3rem; background: transparent; }
.title-in:hover { border-color: var(--line); }
.date-in { font-size: .95rem; padding: .2rem .4rem; }
.tabs { display: flex; gap: .25rem; border-bottom: 1px solid var(--line); margin-bottom: 1rem; overflow-x: auto; }
.tabs a { padding: .6rem .95rem; color: var(--muted); font-weight: 500; border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs a.on { color: var(--accent); border-bottom-color: var(--accent); }
.tabs a:hover { text-decoration: none; color: var(--ink); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 1rem 1.1rem; margin-bottom: 1rem; box-shadow: var(--shadow); }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: .75rem; flex-wrap: wrap; margin-bottom: .5rem; }
.card-head h2, .card-head h3 { margin: 0; }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
.grid-cards > .card { margin: 0; }
.two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1rem; }
.toolbar { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-bottom: .75rem; }
.row-actions { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-top: .6rem; }
.welcome ol { padding-left: 1.2rem; }
.welcome li { margin: .35rem 0; }
.danger-zone { border-color: #fecaca; background: #fffafa; }

/* ---------- Boutons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .4rem; min-height: 40px; padding: .45rem .95rem;
  border: 1px solid var(--line); border-radius: 10px; background: #fff; font-weight: 500; color: var(--ink); text-decoration: none; white-space: nowrap;
}
.btn:hover { background: var(--soft); text-decoration: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: #0c5f58; }
.btn.ghost { background: transparent; }
.btn.danger { background: var(--abs); border-color: var(--abs); color: #fff; }
.btn.small { min-height: 32px; padding: .25rem .65rem; font-size: .88rem; }
.btn.big { min-height: 52px; padding: .6rem 1.2rem; font-size: 1.05rem; }
.btn[disabled] { opacity: .45; cursor: default; }
.icon-btn { display: inline-grid; place-items: center; width: 34px; height: 34px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); }
.icon-btn:hover { background: var(--soft); color: var(--ink); }
.link { border: 0; background: none; color: var(--accent); padding: 0; text-decoration: underline; }
.ic { flex-shrink: 0; }

/* ---------- Formulaires ---------- */
.field { display: flex; flex-direction: column; gap: .3rem; margin: .6rem 0; }
.field > span { font-size: .88rem; font-weight: 600; color: var(--muted); }
.field.inline { flex-direction: row; align-items: center; gap: .75rem; flex-wrap: wrap; }
.field.inline > span { min-width: 12rem; }
.field input[type=number] { width: 6rem; }
.checks { display: flex; flex-wrap: wrap; gap: .5rem 1rem; }
.check { display: flex; align-items: center; gap: .35rem; }
.radio, .toggle { display: flex; gap: .65rem; align-items: flex-start; padding: .55rem .65rem; border: 1px solid var(--line); border-radius: 10px; margin: .35rem 0; cursor: pointer; }
.radio:hover, .toggle:hover { background: var(--soft); }
.radio input, .toggle input { margin-top: .25rem; width: 1.15rem; height: 1.15rem; accent-color: var(--accent); }
.radio span, .toggle span { display: flex; flex-direction: column; }
.radio small, .toggle small { color: var(--muted); }
.num { width: 5.5rem; }
details.explain { margin-top: .75rem; background: var(--soft); border-radius: 10px; padding: .55rem .8rem; }
details.explain summary { cursor: pointer; font-weight: 600; color: var(--accent); }
.preview { margin-top: .5rem; }
select.missing { border-color: var(--inj); background: var(--inj-bg); }

/* ---------- Tableaux ---------- */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tbl { width: 100%; border-collapse: collapse; }
.tbl th, .tbl td { padding: .5rem .55rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.tbl th { font-size: .82rem; color: var(--muted); font-weight: 600; background: #fafbfc; }
.tbl.small th, .tbl.small td { padding: .35rem .45rem; font-size: .9rem; }
.tbl tbody tr:hover { background: #fafcfc; }
.tbl input:not([type=checkbox]) { width: 100%; min-width: 7rem; }
.tbl input.num { width: 5.5rem; min-width: 0; }
.tbl.grades select { padding: .25rem; }
.tbl tr.hot-a td { background: #f0fbf6; }
.tbl tr.hot-b td { background: #fff7f0; }
.th-sort { border: 0; background: none; font-weight: 600; color: var(--muted); padding: 0; font-size: .82rem; text-align: left; }
.th-sort.on { color: var(--accent); }
.mini-photo { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--soft); display: grid; place-items: center; overflow: hidden; padding: 0; color: var(--muted); }
.mini-photo img { width: 100%; height: 100%; object-fit: cover; }

/* ---------- Pastilles ---------- */
.pill { display: inline-block; padding: .15rem .6rem; border-radius: 999px; font-size: .85rem; font-weight: 600; }
.pill.P { background: var(--ok-bg); color: var(--ok); }
.pill.A { background: var(--abs-bg); color: var(--abs); }
.pill.B { background: var(--inj-bg); color: var(--inj); }
.counts { display: flex; gap: .4rem; flex-wrap: wrap; margin: 0; flex: 1; }
.dot { display: inline-block; border-radius: 50%; border: 1px solid rgba(0, 0, 0, .18); vertical-align: middle; flex-shrink: 0; }
.team-chip { display: inline-block; padding: .12rem .6rem; border-radius: 999px; font-weight: 600; font-size: .88rem; border: 1px solid rgba(0, 0, 0, .12); white-space: nowrap; }
.lvl { display: inline-block; min-width: 2.6rem; text-align: center; padding: .1rem .45rem; border-radius: 7px; font-weight: 700; font-size: .88rem; color: var(--c); background: color-mix(in srgb, var(--c) 14%, white); border: 1px solid color-mix(in srgb, var(--c) 35%, white); }
.lvl.none { color: var(--muted); background: var(--soft); border-color: var(--line); }

/* ---------- Accueil ---------- */
.class-card h2 a { color: var(--ink); }
.cycle-list { list-style: none; padding: 0; margin: .5rem 0; }
.cycle-list li { display: flex; justify-content: space-between; align-items: center; gap: .5rem; padding: .45rem 0; border-top: 1px solid var(--line); }
.lesson-list { display: grid; gap: .6rem; }
.lesson-card { display: grid; grid-template-columns: 7rem 9rem 1fr auto auto; align-items: center; gap: .75rem; margin: 0; color: var(--ink); }
.lesson-card:hover { text-decoration: none; border-color: var(--accent); }
.teams-dots { display: flex; gap: 3px; }

/* ---------- Appel ---------- */
.att-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .6rem; }
.att {
  display: flex; flex-direction: column; align-items: flex-start; gap: .05rem; min-height: 78px; padding: .6rem .75rem;
  border-radius: 12px; border: 2px solid transparent; text-align: left; transition: transform .08s;
}
.att:active { transform: scale(.97); }
.att b { font-size: 1.08rem; }
.att span { font-size: .85rem; opacity: .8; }
.att em { font-style: normal; font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; margin-top: auto; }
.att.P { background: var(--ok-bg); border-color: #86efac; color: #14532d; }
.att.A { background: var(--abs-bg); border-color: #fca5a5; color: #7f1d1d; }
.att.B { background: var(--inj-bg); border-color: #fdba74; color: #7c2d12; }

/* ---------- Équipes ---------- */
.pick-bar { position: sticky; top: 58px; z-index: 5; background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px; padding: .55rem .8rem; margin-bottom: .75rem; }
.teams-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: .8rem; }
.teams-grid .card { margin: 0; }
.team { border-top: 5px solid var(--tc, var(--line)); }
.team.others { --tc: #cbd5e1; background: #fbfcfd; }
.card.target { cursor: pointer; outline: 2px dashed var(--accent); outline-offset: 2px; }
.card.target:hover { background: var(--accent-soft); }
.team-head { display: flex; align-items: center; gap: .5rem; margin-bottom: .5rem; flex-wrap: wrap; }
.team.others .team-meta { flex-basis: 100%; }
.team-name { border: 1px solid rgba(0, 0, 0, .12); border-radius: 8px; padding: .3rem .75rem; font-weight: 700; }
.team-name.plain { border: 0; padding: 0; font-size: 1.02rem; }
.team-meta { flex: 1; font-size: .82rem; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: .35rem; }
.chips.coaches { margin-top: .5rem; padding-top: .5rem; border-top: 1px dashed var(--line); align-items: center; }
.role { font-size: .78rem; font-weight: 700; color: var(--inj); text-transform: uppercase; }
.stu { display: inline-flex; align-items: center; gap: .35rem; padding: .35rem .6rem; min-height: 38px; border-radius: 9px; border: 1px solid var(--line); background: #fff; font-size: .93rem; }
.stu:hover { border-color: var(--accent); }
.stu.picked { background: #fef3c7; border-color: #f59e0b; box-shadow: 0 0 0 2px #fcd34d; }
.stu.hurt { background: var(--inj-bg); border-color: #fdba74; }
.sx { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; font-size: .68rem; font-weight: 700; }
.sx.F { background: #fce7f3; color: #be185d; }
.sx.G { background: #dbeafe; color: #1d4ed8; }
.sx.X { background: var(--soft); color: var(--muted); }
.mini-lvl { font-size: .72rem; font-weight: 700; color: var(--muted); background: var(--soft); border-radius: 5px; padding: 0 .3rem; }
.pool { background: #fffdf5; }
.others-list { display: grid; gap: .4rem; }
.other-row { display: flex; gap: .5rem; align-items: center; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: .45rem; }
.swatch { min-height: 48px; border-radius: 10px; border: 2px solid rgba(0, 0, 0, .12); font-weight: 600; font-size: .85rem; }
.swatch.on { box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--ink); }
.vs-pick { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
.vs-pick select { flex: 1; min-width: 8rem; font-size: 1.05rem; padding: .6rem; }

/* ---------- Matchs et planning ---------- */
.rotations { padding-left: 1.2rem; }
.rotations li { margin: .6rem 0; }
.games { display: flex; flex-direction: column; gap: .35rem; margin: .35rem 0; }
.game { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
.vs { font-weight: 700; min-width: 3.5rem; text-align: center; }
.match-list { list-style: none; padding: 0; margin: 0; }
.match-list li { display: flex; align-items: center; gap: .75rem; padding: .5rem 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.match-list li a { display: flex; align-items: center; gap: .5rem; color: var(--ink); }
.match-list li .icon-btn { margin-left: auto; }
.score-head { display: flex; justify-content: center; align-items: center; gap: 1rem; margin: .5rem 0 0; flex-wrap: wrap; }
.score-head .team-chip { font-size: 1.1rem; padding: .3rem .9rem; }
.big-score { font-size: 2.4rem; font-variant-numeric: tabular-nums; }
.event-log { list-style: none; padding: 0; margin: 0; max-height: 420px; overflow-y: auto; }
.event-log li { display: flex; align-items: center; gap: .55rem; padding: .3rem 0; border-top: 1px solid var(--line); }
.event-log .t { font-variant-numeric: tabular-nums; color: var(--muted); width: 3rem; }
.event-log .icon-btn { margin-left: auto; }

/* ---------- Graphiques ---------- */
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: #eef0f2; stroke-width: 1; }
.chart .zero { stroke: #9ca3af; stroke-width: 1.5; }
.chart .tick { font-size: 11px; fill: var(--muted); }
.chart .lab { font-size: 12px; fill: #374151; font-weight: 600; }
.legend { display: flex; align-items: center; gap: .4rem; font-size: .85rem; color: var(--muted); }
.lg { display: inline-block; width: 22px; height: 3px; background: var(--c); margin-left: .6rem; }
.lg.dash { background: repeating-linear-gradient(90deg, var(--c) 0 5px, transparent 5px 9px); }
.mirror { display: grid; gap: .35rem; margin: .5rem 0; }
.mirror-head, .mirror-row { display: grid; grid-template-columns: 1fr 9rem 1fr; align-items: center; gap: .5rem; }
.mirror-head span:first-child { text-align: right; }
.ml { text-align: center; font-size: .85rem; color: var(--muted); font-weight: 600; }
.mb { display: flex; align-items: center; gap: .4rem; height: 24px; }
.mb.left { flex-direction: row; justify-content: flex-end; }
.mb i { display: block; height: 100%; min-width: 2px; border-radius: 5px; border: 1px solid rgba(0, 0, 0, .08); }
.mb .v { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 1.6rem; text-align: center; white-space: nowrap; flex-shrink: 0; }
.dist { display: flex; gap: 1rem; align-items: flex-end; height: 130px; padding: .5rem 0; }
.dist-col { display: flex; flex-direction: column; align-items: center; gap: .2rem; flex: 1; max-width: 80px; }
.dist-col i { display: block; width: 100%; border-radius: 6px 6px 0 0; }
.dist-col span { font-size: .8rem; color: var(--muted); font-weight: 600; }
.gauge { height: 16px; border-radius: 999px; background: var(--soft); overflow: hidden; border: 1px solid var(--line); }
.gauge i { display: block; height: 100%; border-radius: 999px; background: var(--ok); }
.gauge.warn i { background: #f59e0b; }
.gauge.bad i { background: var(--abs); }

/* ---------- Fiche élève ---------- */
.dossier-head { display: flex; align-items: center; gap: 1.25rem; flex-wrap: wrap; }
.photo { width: 92px; height: 92px; border-radius: 50%; border: 1px solid var(--line); background: var(--soft); display: grid; place-items: center; overflow: hidden; padding: 0; color: var(--muted); }
.photo img { width: 100%; height: 100%; object-fit: cover; }
.d-level { display: flex; align-items: center; gap: .75rem; flex: 1; min-width: 240px; }
.d-level small { display: block; color: var(--muted); }
.big-lvl { display: grid; place-items: center; width: 70px; height: 70px; border-radius: 16px; font-size: 1.6rem; font-weight: 800; color: var(--c); background: color-mix(in srgb, var(--c) 13%, white); border: 2px solid color-mix(in srgb, var(--c) 40%, white); }
.d-set .field.inline > span { min-width: 9rem; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .7rem; margin-bottom: 1rem; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: .8rem; display: flex; flex-direction: column; box-shadow: var(--shadow); }
.tile b { font-size: 1.45rem; }
.tile span { color: var(--muted); font-size: .88rem; }
.tile small { color: var(--muted); font-size: .78rem; }

/* ---------- Situations ---------- */
.sit { border: 1px solid var(--line); border-radius: var(--r); padding: .85rem 1rem; background: #fff; }
.grid-cards .sit { margin: 0; }
.sit h3 { margin-bottom: .2rem; }
.sit .tags { color: var(--muted); font-size: .82rem; margin-top: 0; }
.sit img { max-width: 100%; border-radius: 8px; margin: .4rem 0; }
.sit .var { font-size: .9rem; padding: .35rem .55rem; border-radius: 8px; }
.sit .var.easy { background: #f0fdf4; }
.sit .var.hard { background: #fff7ed; }
.sit.big { font-size: 1.2rem; padding: 1.3rem 1.5rem; }
.sit.big h3 { font-size: 1.6rem; }
.img-pick { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
.img-pick img { max-height: 90px; border-radius: 8px; }

/* ---------- Fenêtres et messages ---------- */
.modal-wrap { position: fixed; inset: 0; z-index: 100; background: rgba(17, 24, 39, .35); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 1rem 1rem; overflow-y: auto; animation: fade .12s ease-out; }
.modal { background: #fff; border-radius: 16px; width: 100%; max-width: 520px; box-shadow: 0 20px 50px rgba(0, 0, 0, .2); }
.modal.wide { max-width: min(900px, 94vw); }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: .9rem 1.1rem .4rem; }
.modal-head h2 { margin: 0; font-size: 1.15rem; }
.modal-body { padding: .3rem 1.1rem 1rem; }
.modal-foot { display: flex; justify-content: flex-end; gap: .5rem; padding: .75rem 1.1rem; border-top: 1px solid var(--line); background: #fafbfc; border-radius: 0 0 16px 16px; }
.choice-list { display: grid; gap: .5rem; margin-top: .75rem; }
.choice-list .btn { flex-direction: column; align-items: flex-start; white-space: normal; text-align: left; }
.choice-list .btn small { font-weight: 400; opacity: .85; }

.acts.n1 .act-btn { min-height: 120px; }

.acts.n2 { grid-template-columns: 1fr 1fr; }
.acts.n2 .act-btn { min-height: 100px; }
.acts.n3 { grid-template-columns: repeat(3, 1fr); }
.acts.n4 { grid-template-columns: 1fr 1fr; }
.acts.n5 { grid-template-columns: repeat(3, 1fr); }

.acts.n4 { grid-template-columns: repeat(4, 1fr); }
.tbl.rules td.order { white-space: nowrap; }

/* ---------- Leçon : accès au cycle ---------- */
.cycle-bar { display: flex; justify-content: space-between; align-items: center; gap: .6rem; flex-wrap: wrap; margin-bottom: .6rem; }

.big-lvl small { font-size: .8rem; font-weight: 600; opacity: .8; }
.tile b small { font-size: .85rem; font-weight: 600; color: var(--muted); }

/* ---------- Générateur de tournoi ---------- */
.pick-box { border: 1px solid var(--line); border-radius: 12px; padding: .5rem .9rem .8rem; margin: .6rem 0; }
.pick-box legend { font-size: .82rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); padding: 0 .4rem; }
.opp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: .5rem; }

.fixtures { line-height: 2; }

.big-check { padding: .4rem 0; font-size: 1.02rem; }
.big-check input { width: 1.25rem; height: 1.25rem; accent-color: var(--accent); }
.summary { background: #edf3fb; border-left: 4px solid #3b6fb6; border-radius: 8px; padding: .75rem 1rem; margin-top: .6rem; }
.field small.hint { font-weight: 500; }
.leg { font-size: .75rem; font-weight: 700; text-transform: uppercase; color: #3b6fb6; background: #edf3fb; border-radius: 6px; padding: .05rem .4rem; }

/* ---------- Grands écrans (ordinateur, TBI) ---------- */

  .teams-grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }

/* Un tableau large défile dans sa case au lieu d'élargir toute la page. */
.two-col > *, .grid-cards > *, .teams-grid > *, .cols > * { min-width: 0; }

<div id="app"><p class="loading">Chargement…</p></div>

<script>
/* js/core.js */
/*
 * Noyau de l'application : l'état, l'enregistrement et les petits outils
 * partagés par tous les écrans. Tout le reste s'appuie sur APP, c'est pour
 * ça que ce fichier est chargé en premier.
 */
var APP = (function () {
  'use strict';

  // Une seule clé pour tout : c'est plus simple à sauvegarder, à restaurer
  // et à effacer d'un coup. Le « v1 » permettra de migrer plus tard sans
  // casser ce qui est déjà enregistré dans les tablettes.
  var KEY = 'organisation-ca4:v1';
  var QUOTA = 5 * 1024 * 1024;

  var state = null;
  var storageOk = true;
  var renderHook = null;
  var cache = {};

  function uid(prefix) {
    return (prefix || 'x') + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function blank() {
    return {
      v: 1,
      settings: { pin: '0000', school: 'Collège Louis Pasteur — Villemomble' },
      classes: [], cycles: [], lessons: [], matches: [], bank: [],
      kiosk: { on: false, lessonId: null, matchId: null, screen: 'home' }
    };
  }

  // On complète plutôt qu'on ne rejette : une sauvegarde faite avec une
  // version plus ancienne doit toujours pouvoir s'ouvrir.
  function normalize(s) {
    var b = blank();
    if (!s || typeof s !== 'object') return b;
    ['classes', 'cycles', 'lessons', 'matches', 'bank'].forEach(function (k) {
      if (!Array.isArray(s[k])) s[k] = [];
    });
    s.settings = Object.assign({}, b.settings, s.settings || {});
    // Le premier code proposé était 1234 ; le code convenu est 0000.
    if (s.settings.pin === '1234' && !s.settings.pinChosen) s.settings.pin = '0000';
    s.kiosk = Object.assign({}, b.kiosk, s.kiosk || {});
    s.v = 1;
    return s;
  }

  function load() {
    var raw = null;
    try { raw = window.localStorage.getItem(KEY); } catch (e) { storageOk = false; }
    try { state = normalize(raw ? JSON.parse(raw) : null); }
    catch (e) {
      // Des données illisibles ne doivent pas bloquer le cours : on repart
      // à vide mais on garde une copie pour pouvoir les récupérer à la main.
      try { window.localStorage.setItem(KEY + ':illisible', raw); } catch (e2) { /* tant pis */ }
      state = blank();
    }
    cache = {};
    return state;
  }

  function serialize() { return JSON.stringify(state); }

  function save() {
    cache = {};
    if (!storageOk) return false;
    try { window.localStorage.setItem(KEY, serialize()); return true; }
    catch (e) {
      if (window.UI) UI.toast('Mémoire pleine : va dans « Données » pour alléger les images.', 'err');
      return false;
    }
  }

  function set(fn) { fn(state); save(); render(); }
  function setQuiet(fn) { fn(state); save(); }
  function render() { if (renderHook) renderHook(); }
  function onRender(fn) { renderHook = fn; }
  function replace(next) { state = normalize(next); save(); render(); }

  /* ---------- Recherches ---------- */

  function byId(list, id) {
    if (!list || id == null) return null;
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  function cls(id) { return byId(state.classes, id); }
  function cycle(id) { return byId(state.cycles, id); }
  function lesson(id) { return byId(state.lessons, id); }
  function match(id) { return byId(state.matches, id); }

  function student(sid) {
    if (!cache.st) {
      cache.st = {};
      state.classes.forEach(function (c) { c.students.forEach(function (s) { cache.st[s.id] = s; }); });
    }
    return cache.st[sid] || null;
  }
  function lessonsOf(cycleId) {
    return state.lessons.filter(function (l) { return l.cycleId === cycleId; })
      .sort(function (a, b) { return a.n - b.n; });
  }
  function matchesOf(lessonId) {
    return state.matches.filter(function (m) { return m.lessonId === lessonId; })
      .sort(function (a, b) { return a.created - b.created; });
  }
  function matchesOfCycle(cycleId) {
    var ids = {};
    lessonsOf(cycleId).forEach(function (l) { ids[l.id] = l.n; });
    return state.matches.filter(function (m) { return ids[m.lessonId] != null; })
      .sort(function (a, b) { return (ids[a.lessonId] - ids[b.lessonId]) || (a.created - b.created); });
  }
  function prevLesson(l) {
    var list = lessonsOf(l.cycleId).filter(function (x) { return x.n < l.n; });
    return list.length ? list[list.length - 1] : null;
  }
  function studentsOfCycle(cycleId) {
    var c = cycle(cycleId); var k = c && cls(c.classId);
    return k ? k.students.slice().sort(byName) : [];
  }
  function byName(a, b) {
    return (a.first + ' ' + a.last).localeCompare(b.first + ' ' + b.last, 'fr');
  }

  /* ---------- Textes ---------- */

  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  // Prénom + initiale : c'est ce qu'on lit le plus vite sur une tablette,
  // et deux élèves au même prénom restent différenciés.
  function name(s, full) {
    if (!s) return '?';
    if (full) return s.first + ' ' + s.last;
    return s.first + (s.last ? ' ' + s.last.charAt(0).toUpperCase() + '.' : '');
  }
  function sname(sid, full) { return name(student(sid), full); }

  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmtDate(iso) {
    if (!iso) return '';
    var p = iso.split('-');
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    var j = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'][d.getDay()];
    var m = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'][d.getMonth()];
    return j + ' ' + d.getDate() + ' ' + m;
  }
  function fmtTime(sec) {
    sec = Math.max(0, Math.round(sec || 0));
    return Math.floor(sec / 60) + ':' + pad(sec % 60);
  }
  function fmtMin(sec) {
    var m = (sec || 0) / 60;
    return m < 10 ? (Math.round(m * 10) / 10).toString().replace('.', ',') + ' min' : Math.round(m) + ' min';
  }
  function num(x, d) {
    if (x == null || isNaN(x)) return '–';
    var p = Math.pow(10, d == null ? 1 : d);
    return (Math.round(x * p) / p).toString().replace('.', ',');
  }
  function signed(x, d) { return x == null || isNaN(x) ? '–' : (x > 0 ? '+' : x < 0 ? '−' : '') + num(Math.abs(x), d); }
  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
  function sum(a) { return a.reduce(function (s, x) { return s + x; }, 0); }
  function mean(a) { return a.length ? sum(a) / a.length : null; }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function deaccent(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function plural(n, one, many) { return n + ' ' + (n > 1 ? (many || one + 's') : one); }

  /* ---------- CSV ---------- */

  // Les exports Pronote, ENT ou tableur n'ont jamais le même séparateur :
  // on devine d'après la première ligne plutôt que d'imposer un format.
  function parseCSV(text) {
    text = String(text || '').replace(/^﻿/, '');
    var first = text.split(/\r?\n/)[0] || '';
    var counts = { ';': 0, ',': 0, '\t': 0 };
    var q = false;
    for (var i = 0; i < first.length; i++) {
      var ch = first[i];
      if (ch === '"') q = !q;
      else if (!q && counts[ch] != null) counts[ch]++;
    }
    var sep = ';';
    if (counts['\t'] > counts[sep] && counts['\t'] >= counts[',']) sep = '\t';
    else if (counts[','] > counts[';']) sep = ',';

    var rows = [], row = [], cell = '', inQ = false;
    for (var j = 0; j < text.length; j++) {
      var c = text[j];
      if (inQ) {
        if (c === '"') { if (text[j + 1] === '"') { cell += '"'; j++; } else inQ = false; }
        else cell += c;
      } else if (c === '"') inQ = true;
      else if (c === sep) { row.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[j + 1] === '\n') j++;
        row.push(cell); rows.push(row); row = []; cell = '';
      } else cell += c;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows.map(function (r) { return r.map(function (x) { return x.trim(); }); })
      .filter(function (r) { return r.some(function (x) { return x !== ''; }); });
  }

  function normSex(v) {
    v = deaccent(v).trim().toLowerCase();
    if (!v) return '';
    if (/^(f|fille|filles|feminin|femme|female|w)\b/.test(v)) return 'F';
    if (/^(g|m|h|garcon|garcons|masculin|homme|male)\b/.test(v)) return 'G';
    return '';
  }

  function cap(w) {
    return w.toLowerCase().replace(/(^|[\s\-'])([a-zà-ÿ])/g, function (m, a, b) { return a + b.toUpperCase(); });
  }
  function isUpperWord(w) { return /[A-ZÀ-Ý]/.test(w) && w === w.toUpperCase(); }

  // « DUPONT Marie-Claire » (Pronote) ou « Marie Dupont » (saisie libre) :
  // les mots en capitales sont le nom, le reste le prénom.
  function splitFull(full) {
    var words = full.replace(/\s+/g, ' ').trim().split(' ');
    var last = words.filter(isUpperWord), first = words.filter(function (w) { return !isUpperWord(w); });
    if (last.length && first.length) return { last: cap(last.join(' ')), first: first.join(' ') };
    if (words.length === 1) return { last: '', first: cap(words[0]) };
    if (last.length) return { last: cap(words.slice(0, -1).join(' ')), first: cap(words[words.length - 1]) };
    return { first: words[0], last: words.slice(1).join(' ') };
  }

  function toStudents(text) {
    var rows = parseCSV(text), out = [], warnings = [];
    if (!rows.length) return { students: [], warnings: ['Le fichier est vide.'] };
    var head = rows[0].map(function (h) { return deaccent(h).toLowerCase().replace(/\s+/g, ' ').trim(); });
    var ix = { last: -1, first: -1, sex: -1, full: -1, cls: -1, level: -1 };
    head.forEach(function (h, i) {
      if (ix.full < 0 && /^(eleve|eleves|nom complet|nom et prenom|nom prenom|nom - prenom|identite|name|full name)$/.test(h)) ix.full = i;
      else if (ix.first < 0 && /^(prenoms?|first ?name|first)\b/.test(h)) ix.first = i;
      else if (ix.sex < 0 && /^(sexe|genre|sex|gender|f\/g|g\/f|m\/f|f\/m|fille\/garcon)/.test(h)) ix.sex = i;
      else if (ix.cls < 0 && /^(classe|division|groupe|class)/.test(h)) ix.cls = i;
      else if (ix.level < 0 && /^niveau/.test(h)) ix.level = i;
      else if (ix.last < 0 && /^(nom|last ?name|famille|surname)\b/.test(h)) ix.last = i;
    });
    var hasHead = Object.keys(ix).some(function (k) { return ix[k] >= 0; });
    var body = hasHead ? rows.slice(1) : rows;
    if (!hasHead) {
      if (rows[0].length >= 2) {
        ix.last = 0; ix.first = 1;
        if (rows[0].length >= 3 && normSex(rows[0][2])) ix.sex = 2;
      } else ix.full = 0;
    }
    // Une seule colonne « Nom » qui contient en fait « NOM Prénom ».
    if (ix.last >= 0 && ix.first < 0 && ix.full < 0) { ix.full = ix.last; ix.last = -1; }

    body.forEach(function (r) {
      var s = { first: '', last: '', sex: '' };
      if (ix.full >= 0 && r[ix.full]) { var sp = splitFull(r[ix.full]); s.first = sp.first; s.last = sp.last; }
      if (ix.first >= 0 && r[ix.first]) s.first = r[ix.first];
      if (ix.last >= 0 && r[ix.last]) s.last = r[ix.last];
      if (ix.sex >= 0) s.sex = normSex(r[ix.sex]);
      if (ix.cls >= 0 && r[ix.cls]) s.cls = r[ix.cls];
      if (ix.level >= 0 && r[ix.level]) {
        var lv = parseFloat(String(r[ix.level]).replace(',', '.'));
        // 1 à 4 : degrés de maîtrise ; au-delà de 4 (jusqu'à 10) : note sur 10.
        if (lv >= 1 && lv <= 4) s.level = lv;
        else if (lv > 4 && lv <= 10) s.level = Math.round((1 + lv * 0.3) * 1000) / 1000;
      }
      s.first = s.first.replace(/\s+/g, ' ').trim();
      s.last = s.last.replace(/\s+/g, ' ').trim();
      if (s.first && s.first === s.first.toUpperCase()) s.first = cap(s.first);
      if (s.last && s.last === s.last.toUpperCase()) s.last = cap(s.last);
      if (s.first || s.last) out.push(s);
    });
    var noSex = out.filter(function (s) { return !s.sex; }).length;
    if (noSex) warnings.push(plural(noSex, 'élève') + ' sans fille/garçon : tu pourras le corriger dans la liste.');
    return { students: out, warnings: warnings };
  }

  // Pronote enregistre souvent en Windows-1252 : on tente l'UTF-8 strict et on
  // bascule si des caractères ne passent pas, sinon les accents sont perdus.
  function readTextFile(file, cb) {
    var r = new FileReader();
    r.onload = function () {
      var buf = r.result, txt;
      try { txt = new TextDecoder('utf-8', { fatal: true }).decode(buf); }
      catch (e) { try { txt = new TextDecoder('windows-1252').decode(buf); } catch (e2) { txt = ''; } }
      cb(txt);
    };
    r.readAsArrayBuffer(file);
  }

  function toCSV(rows) {
    return '﻿' + rows.map(function (r) {
      return r.map(function (c) {
        c = c == null ? '' : String(c);
        return /[;"\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c;
      }).join(';');
    }).join('\r\n');
  }

  return {
    KEY: KEY, QUOTA: QUOTA,
    get state() { return state; },
    get storageOk() { return storageOk; },
    uid: uid, blank: blank, normalize: normalize, load: load, save: save, serialize: serialize,
    set: set, setQuiet: setQuiet, render: render, onRender: onRender, replace: replace,
    byId: byId, cls: cls, cycle: cycle, lesson: lesson, match: match, student: student,
    lessonsOf: lessonsOf, matchesOf: matchesOf, matchesOfCycle: matchesOfCycle, prevLesson: prevLesson,
    studentsOfCycle: studentsOfCycle, byName: byName,
    esc: esc, name: name, sname: sname, today: today, fmtDate: fmtDate, fmtTime: fmtTime, fmtMin: fmtMin,
    num: num, signed: signed, clamp: clamp, sum: sum, mean: mean, clone: clone, deaccent: deaccent, plural: plural,
    csv: { parse: parseCSV, toStudents: toStudents, normSex: normSex, splitFull: splitFull, build: toCSV },
    readTextFile: readTextFile
  };
})();

</script>
<script>
/* js/ui.js */
/*
 * Briques d'interface réutilisées partout : fenêtres, messages, couleurs de
 * chasubles, petits graphiques en SVG, images. Aucune de ces fonctions ne
 * touche aux données : elles affichent, c'est tout.
 */
var UI = (function () {
  'use strict';
  var esc = APP.esc;

  // Les couleurs suivent les chasubles qu'on trouve dans un local EPS,
  // pas une palette de designer : l'élève doit reconnaître la sienne.
  var COLORS = [
    { id: 'rouge', label: 'Rouges', hex: '#e53935' },
    { id: 'bleu', label: 'Bleus', hex: '#1e6fd9' },
    { id: 'jaune', label: 'Jaunes', hex: '#fdd835' },
    { id: 'vert', label: 'Verts', hex: '#2e9e44' },
    { id: 'orange', label: 'Oranges', hex: '#fb8c00' },
    { id: 'violet', label: 'Violets', hex: '#8e24aa' },
    { id: 'rose', label: 'Roses', hex: '#ec407a' },
    { id: 'ciel', label: 'Ciels', hex: '#4fc3f7' },
    { id: 'blanc', label: 'Blancs', hex: '#ffffff' },
    { id: 'noir', label: 'Noirs', hex: '#263238' },
    { id: 'gris', label: 'Gris', hex: '#9e9e9e' },
    { id: 'marron', label: 'Marrons', hex: '#795548' }
  ];
  function color(id) {
    for (var i = 0; i < COLORS.length; i++) if (COLORS[i].id === id) return COLORS[i];
    return COLORS[10];
  }
  // Texte noir ou blanc selon la clarté du fond, pour rester lisible au soleil
  // comme sous les néons du gymnase.
  function ink(hex) {
    var h = hex.replace('#', '');
    var r = parseInt(h.substr(0, 2), 16), g = parseInt(h.substr(2, 2), 16), b = parseInt(h.substr(4, 2), 16);
    return (r * 0.299 + g * 0.587 + b * 0.114) > 160 ? '#1f2937' : '#ffffff';
  }
  function tint(hex, a) {
    var h = hex.replace('#', '');
    return 'rgba(' + parseInt(h.substr(0, 2), 16) + ',' + parseInt(h.substr(2, 2), 16) + ',' + parseInt(h.substr(4, 2), 16) + ',' + a + ')';
  }
  // Le blanc et le jaune disparaissent sur fond clair : on leur ajoute un
  // contour plutôt que de changer la couleur réelle de la chasuble.
  function dot(colorId, size) {
    var c = color(colorId);
    return '<span class="dot" style="background:' + c.hex + ';width:' + (size || 14) + 'px;height:' + (size || 14) + 'px"></span>';
  }
  function chip(team) {
    var c = color(team.color);
    return '<span class="team-chip" style="background:' + c.hex + ';color:' + ink(c.hex) + '">' + esc(team.name) + '</span>';
  }

  /* ---------- Icônes ---------- */
  var ICONS = {
    lock: '<path d="M7 11V8a5 5 0 0 1 10 0v3"/><rect x="5" y="11" width="14" height="10" rx="2"/>',
    play: '<path d="M8 5l11 7-11 7z" fill="currentColor"/>',
    pause: '<rect x="7" y="5" width="3.5" height="14" fill="currentColor"/><rect x="13.5" y="5" width="3.5" height="14" fill="currentColor"/>',
    undo: '<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',
    back: '<path d="M15 18l-6-6 6-6"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    full: '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
    trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
    edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/>',
    chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>'
  };
  function icon(n, s) {
    return '<svg class="ic" viewBox="0 0 24 24" width="' + (s || 20) + '" height="' + (s || 20) + '" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[n] || '') + '</svg>';
  }

  /* ---------- Fenêtres ---------- */

  function layer() {
    var el = document.getElementById('modals');
    if (!el) { el = document.createElement('div'); el.id = 'modals'; document.body.appendChild(el); }
    return el;
  }

  // Fenêtre maison plutôt que <dialog>.showModal() : ce dernier est bloqué
  // quand la page est ouverte dans un cadre sécurisé ou depuis un fichier.
  function modal(o) {
    var wrap = document.createElement('div');
    wrap.className = 'modal-wrap';
    var foot = o.okLabel === null
      ? '<button class="btn" data-m="cancel">' + esc(o.cancelLabel || 'Fermer') + '</button>'
      : '<button class="btn" data-m="cancel">' + esc(o.cancelLabel || 'Annuler') + '</button>' +
        '<button class="btn ' + (o.danger ? 'danger' : 'primary') + '" data-m="ok">' + esc(o.okLabel || 'Valider') + '</button>';
    wrap.innerHTML = '<div class="modal' + (o.wide ? ' wide' : '') + '" role="dialog" aria-modal="true" aria-label="' + esc(o.title || '') + '">' +
      '<div class="modal-head"><h2>' + esc(o.title || '') + '</h2><button class="icon-btn" data-m="cancel" aria-label="Fermer">×</button></div>' +
      '<div class="modal-body">' + (o.body || '') + '</div>' +
      (o.noFoot ? '' : '<div class="modal-foot">' + foot + '</div>') + '</div>';
    layer().appendChild(wrap);
    var root = wrap.querySelector('.modal');
    var closed = false;
    function close() {
      if (closed) return; closed = true;
      document.removeEventListener('keydown', onKey);
      if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
      if (o.onClose) o.onClose();
    }
    function ok() {
      if (o.onOk && o.onOk(root, close) === false) return;
      close();
    }
    function onKey(e) {
      if (e.key === 'Escape') close();
      if (e.key === 'Enter' && e.target && e.target.tagName === 'INPUT' && o.okLabel !== null) { e.preventDefault(); ok(); }
    }
    document.addEventListener('keydown', onKey);
    wrap.addEventListener('click', function (e) {
      var b = e.target.closest('[data-m]');
      if (b) { if (b.getAttribute('data-m') === 'ok') ok(); else close(); return; }
      if (e.target === wrap && !o.sticky) close();
    });
    if (o.onOpen) o.onOpen(root, close);
    var f = root.querySelector('input:not([type=checkbox]):not([type=radio]):not([type=file]), textarea, select');
    if (f && !o.noFocus) setTimeout(function () { try { f.focus(); } catch (e) { /* rien */ } }, 30);
    return { root: root, close: close };
  }

  function confirm(text, onYes, opts) {
    opts = opts || {};
    return modal({ title: opts.title || 'Confirmer', body: '<p>' + esc(text) + '</p>', okLabel: opts.okLabel || 'Oui', danger: opts.danger, onOk: function () { onYes(); } });
  }

  // Une question à choix : chaque bouton ferme la fenêtre et renvoie sa valeur.
  function choose(title, text, choices, cb) {
    var body = '<p>' + esc(text) + '</p><div class="choice-list">' + choices.map(function (c, i) {
      return '<button class="btn big ' + (c.primary ? 'primary' : '') + '" data-choice="' + i + '">' + esc(c.label) + (c.hint ? '<small>' + esc(c.hint) + '</small>' : '') + '</button>';
    }).join('') + '</div>';
    return modal({
      title: title, body: body, okLabel: null, cancelLabel: 'Annuler',
      onOpen: function (root, close) {
        root.addEventListener('click', function (e) {
          var b = e.target.closest('[data-choice]');
          if (!b) return;
          close(); cb(choices[+b.getAttribute('data-choice')].value);
        });
      }
    });
  }

  function prompt(title, label, value, cb, opts) {
    opts = opts || {};
    return modal({
      title: title, okLabel: opts.okLabel || 'Valider',
      body: '<label class="field"><span>' + esc(label) + '</span><input type="' + (opts.type || 'text') + '" value="' + esc(value || '') + '" data-p></label>',
      onOk: function (root) { return cb(root.querySelector('[data-p]').value.trim()); }
    });
  }

  function toast(msg, kind) {
    var box = document.getElementById('toasts');
    if (!box) { box = document.createElement('div'); box.id = 'toasts'; document.body.appendChild(box); }
    var t = document.createElement('div');
    t.className = 'toast ' + (kind || '');
    t.textContent = msg;
    box.appendChild(t);
    setTimeout(function () { t.classList.add('out'); }, kind === 'err' ? 4500 : 2600);
    setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, kind === 'err' ? 5000 : 3100);
  }

  /* ---------- Images ---------- */

  // 800 px suffisent pour une photo d'élève ou un schéma de situation, et
  // divisent le poids par dix : c'est ce qui permet de tenir dans 5 Mo.
  function compressDataURL(src, max, quality, cb) {
    var img = new Image();
    img.onload = function () {
      var w = img.width, h = img.height, k = Math.min(1, max / Math.max(w, h));
      var cv = document.createElement('canvas');
      cv.width = Math.round(w * k); cv.height = Math.round(h * k);
      var ctx = cv.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.drawImage(img, 0, 0, cv.width, cv.height);
      var out = cv.toDataURL('image/jpeg', quality);
      cb(out.length < src.length ? out : src);
    };
    img.onerror = function () { cb(null); };
    img.src = src;
  }
  function compressImage(file, cb, max) {
    if (!file || !/^image\//.test(file.type)) { toast('Ce fichier n\'est pas une image.', 'err'); return; }
    var r = new FileReader();
    r.onload = function () { compressDataURL(r.result, max || 800, 0.72, cb); };
    r.readAsDataURL(file);
  }

  /* ---------- Fichiers ---------- */

  function download(filename, content, mime) {
    var blob = content instanceof Blob ? content : new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }
  function pickFile(accept, cb) {
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = accept || '';
    inp.style.display = 'none';
    inp.addEventListener('change', function () { if (inp.files[0]) cb(inp.files[0]); inp.remove(); });
    document.body.appendChild(inp); inp.click();
  }

  /* ---------- Plein écran et son ---------- */

  function fullscreen(on) {
    try {
      var d = document, el = d.documentElement;
      if (on && !d.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(function () {});
      if (!on && d.fullscreenElement && d.exitFullscreen) d.exitFullscreen().catch(function () {});
    } catch (e) { /* certains navigateurs refusent : pas grave, le kiosque marche quand même */ }
  }
  var audio = null;
  function beep(times) {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      for (var i = 0; i < (times || 1); i++) {
        var o = audio.createOscillator(), g = audio.createGain(), t0 = audio.currentTime + i * 0.35;
        o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
        g.gain.setValueAtTime(0.25, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.3);
        o.start(t0); o.stop(t0 + 0.3);
      }
    } catch (e) { /* pas de son possible : l'affichage clignote de toute façon */ }
  }

  /* ---------- Graphiques ---------- */

  // Le rapport de force se lit comme une marée : au-dessus de la ligne, la
  // première équipe domine, en dessous, la seconde. Chaque zone prend la
  // couleur de la chasuble, ce qui parle tout de suite aux élèves.
  function forceChart(timeline, colA, colB, endT, opts) {
    opts = opts || {};
    var W = 640, H = opts.height || 200, P = { l: 34, r: 12, t: 12, b: 26 };
    var maxT = Math.max(endT || 0, timeline.length ? timeline[timeline.length - 1].t : 0, 60);
    var diffs = timeline.map(function (p) { return p.A - p.B; });
    var m = Math.max(2, Math.max.apply(null, diffs.map(Math.abs).concat([1])));
    var x = function (t) { return P.l + (W - P.l - P.r) * t / maxT; };
    var y = function (d) { return P.t + (H - P.t - P.b) * (m - d) / (2 * m); };
    var pts = [[0, 0]], last = 0;
    timeline.forEach(function (p) { var d = p.A - p.B; pts.push([p.t, last]); pts.push([p.t, d]); last = d; });
    pts.push([maxT, last]);
    var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + x(p[0]).toFixed(1) + ' ' + y(p[1]).toFixed(1); }).join(' ');
    var area = line + ' L' + x(maxT).toFixed(1) + ' ' + y(0) + ' L' + x(0) + ' ' + y(0) + ' Z';
    var ticks = '';
    var step = maxT > 900 ? 300 : maxT > 360 ? 120 : 60;
    for (var t = 0; t <= maxT + 1; t += step) {
      ticks += '<line x1="' + x(t) + '" x2="' + x(t) + '" y1="' + P.t + '" y2="' + (H - P.b) + '" class="grid"/>' +
        '<text x="' + x(t) + '" y="' + (H - 8) + '" class="tick" text-anchor="' + (t === 0 ? 'start' : t + step > maxT + 1 ? 'end' : 'middle') + '">' + Math.round(t / 60) + ' min</text>';
    }
    var id = 'fc' + Math.random().toString(36).slice(2, 7);
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Évolution de l\'écart au score">' +
      '<defs><clipPath id="' + id + 'a"><rect x="0" y="0" width="' + W + '" height="' + y(0) + '"/></clipPath>' +
      '<clipPath id="' + id + 'b"><rect x="0" y="' + y(0) + '" width="' + W + '" height="' + H + '"/></clipPath></defs>' +
      ticks +
      '<path d="' + area + '" fill="' + tint(colA, 0.45) + '" clip-path="url(#' + id + 'a)"/>' +
      '<path d="' + area + '" fill="' + tint(colB, 0.45) + '" clip-path="url(#' + id + 'b)"/>' +
      '<line x1="' + P.l + '" x2="' + (W - P.r) + '" y1="' + y(0) + '" y2="' + y(0) + '" class="zero"/>' +
      '<path d="' + line + '" fill="none" stroke="#374151" stroke-width="2"/>' +
      '<text x="' + (P.l - 6) + '" y="' + (y(m) + 10) + '" class="tick" text-anchor="end">+' + m + '</text>' +
      '<text x="' + (P.l - 6) + '" y="' + (y(0) + 4) + '" class="tick" text-anchor="end">0</text>' +
      '<text x="' + (P.l - 6) + '" y="' + (y(-m)) + '" class="tick" text-anchor="end">+' + m + '</text>' +
      (opts.nameA ? '<text x="' + (P.l + 6) + '" y="' + (P.t + 14) + '" class="lab">' + esc(opts.nameA) + ' devant</text>' : '') +
      (opts.nameB ? '<text x="' + (P.l + 6) + '" y="' + (H - P.b - 6) + '" class="lab">' + esc(opts.nameB) + ' devant</text>' : '') +
      '</svg>';
  }

  // Barres en miroir : une équipe à gauche, l'autre à droite, la même ligne
  // pour la même donnée. On compare d'un coup d'œil sans lire de chiffres.
  function mirrorBars(rows, A, B) {
    var ca = color(A.color).hex, cb = color(B.color).hex;
    return '<div class="mirror">' +
      '<div class="mirror-head"><span>' + chip(A) + '</span><span></span><span>' + chip(B) + '</span></div>' +
      rows.map(function (r) {
        var m = r.max || Math.max(r.a, r.b, 1);
        return '<div class="mirror-row"><div class="mb left"><span class="v">' + esc(r.fa || r.a) + '</span><i style="width:' + (100 * r.a / m) + '%;background:' + ca + '"></i></div>' +
          '<div class="ml">' + esc(r.label) + '</div>' +
          '<div class="mb"><i style="width:' + (100 * r.b / m) + '%;background:' + cb + '"></i><span class="v">' + esc(r.fb || r.b) + '</span></div></div>';
      }).join('') + '</div>';
  }

  // Courbe simple pour l'évolution d'un niveau (1 à 4) de leçon en leçon.
  function lineChart(series, opts) {
    opts = opts || {};
    var W = 640, H = opts.height || 200, P = { l: 30, r: 14, t: 12, b: 26 };
    var yMin = opts.yMin == null ? 1 : opts.yMin, yMax = opts.yMax == null ? 4 : opts.yMax;
    var n = Math.max(2, Math.max.apply(null, series.map(function (s) { return s.pts.length; }).concat([2])));
    var x = function (i) { return P.l + (W - P.l - P.r) * i / (n - 1); };
    var y = function (v) { return P.t + (H - P.t - P.b) * (yMax - v) / (yMax - yMin); };
    var g = '';
    for (var v = yMin; v <= yMax; v += (opts.step || 1)) g += '<line x1="' + P.l + '" x2="' + (W - P.r) + '" y1="' + y(v) + '" y2="' + y(v) + '" class="grid"/><text x="' + (P.l - 6) + '" y="' + (y(v) + 4) + '" class="tick" text-anchor="end">' + v + '</text>';
    var labels = opts.labels || [];
    labels.forEach(function (l, i) { g += '<text x="' + x(i) + '" y="' + (H - 8) + '" class="tick" text-anchor="middle">' + esc(l) + '</text>'; });
    series.forEach(function (s) {
      var d = '', dots = '';
      s.pts.forEach(function (p, i) {
        if (p == null) return;
        d += (d ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p).toFixed(1) + ' ';
        dots += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(p).toFixed(1) + '" r="3.5" fill="' + s.color + '"/>';
      });
      g += '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="' + (s.width || 2.5) + '"' + (s.dash ? ' stroke-dasharray="5 4"' : '') + '/>' + dots;
    });
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(opts.label || 'Évolution') + '">' + g + '</svg>';
  }

  function gauge(frac) {
    var p = Math.round(APP.clamp(frac, 0, 1) * 100);
    var cls = p > 85 ? 'bad' : p > 65 ? 'warn' : 'ok';
    return '<div class="gauge ' + cls + '"><i style="width:' + p + '%"></i></div>';
  }

  return {
    COLORS: COLORS, color: color, ink: ink, tint: tint, dot: dot, chip: chip, icon: icon,
    modal: modal, confirm: confirm, choose: choose, prompt: prompt, toast: toast,
    compressImage: compressImage, compressDataURL: compressDataURL, download: download, pickFile: pickFile,
    fullscreen: fullscreen, beep: beep,
    forceChart: forceChart, mirrorBars: mirrorBars, lineChart: lineChart, gauge: gauge,
    acts: {}, chgs: {}
  };
})();

</script>
<script>
/* js/ratings.js */
/*
 * Estimation du niveau de chaque élève, sur l'échelle 1 à 4 des degrés de
 * maîtrise. L'idée : ce qui se passe quand l'élève est sur le terrain.
 * Si son équipe marque plus qu'elle n'encaisse pendant qu'il joue, son
 * niveau monte ; sinon il baisse. On ramène tout au temps de jeu pour ne
 * pas avantager ceux qui jouent plus longtemps.
 */
var RATINGS = (function () {
  'use strict';

  var LEVELS = [
    { n: 1, short: 'MI', label: 'Maîtrise insuffisante', color: '#ef4444' },
    { n: 2, short: 'MF', label: 'Maîtrise fragile', color: '#f59e0b' },
    { n: 3, short: 'MS', label: 'Maîtrise satisfaisante', color: '#22a06b' },
    { n: 4, short: 'TBM', label: 'Très bonne maîtrise', color: '#1e6fd9' }
  ];

  // Réglages du calcul, choisis pour un cycle de 8 à 10 leçons avec des
  // matchs de 5 à 8 minutes :
  // - SHRINK : on fait comme si chaque élève avait déjà joué 4 minutes à +0,
  //   pour qu'un seul bon match ne propulse pas quelqu'un en tête ;
  // - TRUST : au bout de 12 minutes de jeu, le terrain pèse autant que ton
  //   estimation de départ, puis de plus en plus ;
  // - SPREAD : écart autour de la moyenne, pour que la classe s'étale de
  //   1 à 4 sans que tout le monde soit collé aux extrêmes.
  var SHRINK = 4, TRUST = 12, SPREAD = 0.9, MIDDLE = 2.5;

  function info(x) {
    if (x == null) return null;
    var i = x < 1.75 ? 0 : x < 2.5 ? 1 : x < 3.25 ? 2 : 3;
    return LEVELS[i];
  }

  // Le calcul se fait sur l'échelle 1 à 4 des degrés de maîtrise, mais on
  // affiche une note sur 10, plus parlante : 5/10 = milieu de classe, et
  // les quatre degrés tombent pile sur 0–2,5 / 2,5–5 / 5–7,5 / 7,5–10.
  function to10(x) { return x == null ? null : (x - 1) / 3 * 10; }
  function from10(y) { return y == null ? null : 1 + y * 3 / 10; }
  function fmt(x) { return x == null ? '–' : APP.num(to10(x)); }

  function badge(x, known) {
    if (x == null || known === false) return '<span class="lvl none" title="Pas encore assez de jeu">–</span>';
    var l = info(x);
    return '<span class="lvl" style="--c:' + l.color + '" title="' + l.label + ' (sur 10)">' + fmt(x) + '</span>';
  }

  // Unités « niveau » proposées pour un barème. La référence est le plus
  // petit point marqué « normal » (1 unité). Au-delà du double, la valeur
  // est adoucie : une action bonifiée à 100 points compte plus, mais ne
  // doit pas écraser tout le reste du cycle.
  function autoUnits(actions) {
    var made = actions.filter(function (a) { return a.shot === 'made' && a.points > 0; }).map(function (a) { return +a.points; });
    var all = actions.filter(function (a) { return a.points > 0; }).map(function (a) { return +a.points; });
    var ref = made.length ? Math.min.apply(null, made) : all.length ? Math.min.apply(null, all) : 1;
    return function (points) {
      points = +points || 0;
      if (points <= 0) return 0;
      var k = points / ref;
      var u = k <= 2 ? k : 2 + Math.log(k / 2);
      return Math.round(u * 100) / 100;
    };
  }
  function refreshUnits(actions) {
    var f = autoUnits(actions);
    actions.forEach(function (a) { if (a.autoUnits !== false) a.units = f(a.points); });
  }

  // Additionne ce que chaque élève a vécu sur le terrain pendant le cycle,
  // éventuellement jusqu'à une leçon donnée (pour tracer l'évolution).
  function collect(cycleId, uptoN) {
    var agg = {};
    APP.lessonsOf(cycleId).forEach(function (l) {
      if (uptoN != null && l.n > uptoN) return;
      APP.matchesOf(l.id).forEach(function (m) {
        if (!m.events.length) return;
        var r = ARENA.replay(m), win = ARENA.winner(r);
        Object.keys(r.players).forEach(function (sid) {
          var p = r.players[sid];
          var a = agg[sid] || (agg[sid] = { sec: 0, pmU: 0, pmP: 0, pts: 0, made: 0, missed: 0, matches: 0, wins: 0 });
          a.sec += p.sec; a.pmU += p.pmU; a.pmP += p.pmP; a.pts += p.pts; a.made += p.made; a.missed += p.missed;
          if (p.sec > 0) { a.matches++; if (win === p.team) a.wins++; }
        });
      });
    });
    return agg;
  }

  function compute(cycleId, opts) {
    opts = opts || {};
    var c = APP.cycle(cycleId);
    if (!c) return {};
    var students = APP.studentsOfCycle(cycleId);
    var agg = collect(cycleId, opts.uptoN);
    var rates = {}, pool = [];
    students.forEach(function (s) {
      var a = agg[s.id];
      if (a && a.sec > 0) {
        rates[s.id] = a.pmU / (a.sec / 60 + SHRINK);
        pool.push(rates[s.id]);
      }
    });
    var mu = APP.mean(pool) || 0;
    var sd = pool.length > 1 ? Math.sqrt(APP.mean(pool.map(function (x) { return (x - mu) * (x - mu); }))) : 0;
    // Un écart minimal évite qu'une classe où tout le monde est à +0,1
    // soit étirée artificiellement de 1 à 4.
    sd = Math.max(sd, 0.15);
    var out = {};
    students.forEach(function (s) {
      var a = agg[s.id] || { sec: 0, pmU: 0, pmP: 0, pts: 0, made: 0, missed: 0, matches: 0, wins: 0 };
      var prior = c.prior && c.prior[s.id] != null ? +c.prior[s.id] : null;
      var override = c.override && c.override[s.id] != null ? +c.override[s.id] : null;
      var min = a.sec / 60;
      var evidence = rates[s.id] != null ? APP.clamp(MIDDLE + SPREAD * (rates[s.id] - mu) / sd, 1, 4) : null;
      var base = prior != null ? prior : MIDDLE;
      var w = min / (min + TRUST);
      var level = evidence != null ? base * (1 - w) + evidence * w : base;
      var source = evidence != null ? (prior != null ? 'mix' : 'terrain') : (prior != null ? 'depart' : 'aucune');
      if (override != null) { level = override; source = 'toi'; }
      out[s.id] = {
        level: Math.round(level * 100) / 100, known: source !== 'aucune', source: source,
        prior: prior, override: override, evidence: evidence, weight: w,
        minutes: min, sec: a.sec, pmU: a.pmU, pmP: a.pmP, per5: min > 0 ? a.pmU / min * 5 : null,
        pts: a.pts, made: a.made, missed: a.missed, matches: a.matches, wins: a.wins
      };
    });
    return out;
  }

  function sourceLabel(src) {
    return { terrain: 'calculé sur le terrain', mix: 'ton estimation + le terrain', depart: 'ton estimation de départ', toi: 'fixé par toi', aucune: 'pas encore de données' }[src] || '';
  }

  return {
    LEVELS: LEVELS, info: info, badge: badge, to10: to10, from10: from10, fmt: fmt, autoUnits: autoUnits, refreshUnits: refreshUnits,
    collect: collect, compute: compute, sourceLabel: sourceLabel, MIDDLE: MIDDLE,
    acts: {}, chgs: {}
  };
})();

</script>
<script>
/* js/teams.js */
/*
 * Composition automatique des équipes. On part des élèves présents (les
 * blessés et absents sont exclus) avec leur niveau estimé, et on combine
 * deux choix de l'enseignant :
 *  - le niveau : équipes équilibrées, ou groupes de niveau (fortes / faibles) ;
 *  - la mixité : mixte (parité), non mixte (filles / garçons), ou libre.
 */
var TEAMS = (function () {
  'use strict';

  var LEVEL_MODES = [
    { id: 'equilibre', label: 'Équipes équilibrées', hint: 'Niveaux mélangés dans chaque équipe, équipes de même force.' },
    { id: 'homogene', label: 'Groupes de niveau', hint: 'Élèves de même niveau ensemble : des équipes fortes et des équipes plus faibles.' }
  ];
  var MIX_MODES = [
    { id: 'mixte', label: 'Mixte', hint: 'Autant de filles dans chaque équipe, dans la mesure du possible.' },
    { id: 'nonmixte', label: 'Non mixte', hint: 'Équipes de filles et équipes de garçons.' },
    { id: 'libre', label: 'Sans contrainte', hint: 'Seul le niveau compte, peu importe la répartition filles/garçons.' }
  ];

  function sizes(n, T) {
    var out = [], base = Math.floor(n / T), extra = n % T;
    for (var i = 0; i < T; i++) out.push(base + (i < extra ? 1 : 0));
    return out;
  }

  function avg(team) {
    return team.length ? team.reduce(function (s, p) { return s + p.level; }, 0) / team.length : 0;
  }
  // On minimise l'écart entre les moyennes, pas entre les sommes : une
  // équipe de 4 et une de 5 doivent pouvoir se valoir.
  function spread(teams) {
    var ms = teams.filter(function (t) { return t.length; }).map(avg);
    if (ms.length < 2) return 0;
    var mu = ms.reduce(function (a, b) { return a + b; }, 0) / ms.length;
    return ms.reduce(function (s, m) { return s + (m - mu) * (m - mu); }, 0);
  }

  // Petit bruit sur le niveau pour départager les égalités : sans ça,
  // « Refaire » redonnerait toujours exactement les mêmes équipes.
  function jitter(players, amount, rnd) {
    return players.map(function (p) { return { id: p.id, sex: p.sex, level: p.level, key: p.level + (rnd() - 0.5) * amount }; });
  }

  function balance(players, T, mix, rnd) {
    var teams = [];
    for (var i = 0; i < T; i++) teams.push([]);
    if (!players.length) return teams;
    var sorted = players.slice().sort(function (a, b) { return b.key - a.key; });
    if (mix === 'mixte') {
      // Les filles d'abord, réparties une à une sur l'équipe qui en a le
      // moins ; puis les garçons sur l'équipe la moins nombreuse. On obtient
      // à la fois la parité et des effectifs à un élève près.
      var girls = sorted.filter(function (p) { return p.sex === 'F'; });
      var rest = sorted.filter(function (p) { return p.sex !== 'F'; });
      girls.concat(rest).forEach(function (p) {
        var best = 0;
        for (var k = 1; k < T; k++) {
          var a = teams[k], b = teams[best];
          var ca = p.sex === 'F' ? count(a, 'F') : a.length, cb = p.sex === 'F' ? count(b, 'F') : b.length;
          if (ca < cb || (ca === cb && (a.length < b.length || (a.length === b.length && avg(a) < avg(b))))) best = k;
        }
        teams[best].push(p);
      });
    } else {
      // Distribution en serpentin (1-2-3-3-2-1) : un bon point de départ
      // que l'on affine ensuite par échanges.
      sorted.forEach(function (p, idx) {
        var round = Math.floor(idx / T), pos = idx % T;
        teams[round % 2 ? T - 1 - pos : pos].push(p);
      });
    }
    improve(teams, mix === 'mixte', rnd);
    return teams;
  }

  function count(team, sex) { return team.filter(function (p) { return p.sex === sex; }).length; }

  // Échanges deux à deux tant que ça rapproche les moyennes. En mode mixte
  // on n'échange qu'une fille contre une fille (ou un garçon contre un
  // garçon), pour ne pas casser la parité obtenue plus haut.
  function improve(teams, sameSex) {
    var best = spread(teams), changed = true, guard = 0;
    while (changed && guard++ < 60) {
      changed = false;
      for (var a = 0; a < teams.length; a++) {
        for (var b = a + 1; b < teams.length; b++) {
          for (var i = 0; i < teams[a].length; i++) {
            for (var j = 0; j < teams[b].length; j++) {
              var pa = teams[a][i], pb = teams[b][j];
              if (sameSex && (pa.sex === 'F') !== (pb.sex === 'F')) continue;
              teams[a][i] = pb; teams[b][j] = pa;
              var s = spread(teams);
              if (s < best - 1e-9) { best = s; changed = true; }
              else { teams[a][i] = pa; teams[b][j] = pb; }
            }
          }
        }
      }
    }
  }

  function compose(players, o, rnd) {
    rnd = rnd || Math.random;
    var T = Math.max(1, o.count | 0);
    var list = players[0] && players[0].key != null ? players : jitter(players, o.jitter == null ? 0.3 : o.jitter, rnd);
    var n = list.length;

    if (o.mix === 'nonmixte' && T >= 2) {
      var F = list.filter(function (p) { return p.sex === 'F'; });
      var G = list.filter(function (p) { return p.sex !== 'F'; });
      if (F.length && G.length) {
        var TF = APP.clamp(Math.round(T * F.length / n), 1, T - 1);
        var sub = Object.assign({}, o, { mix: 'libre' });
        return compose(F, Object.assign({}, sub, { count: TF }), rnd)
          .concat(compose(G, Object.assign({}, sub, { count: T - TF }), rnd));
      }
    }
    if (o.level === 'homogene' && T >= 2) {
      // « La moitié des équipes » de même niveau : on coupe la classe en un
      // groupe fort et un groupe plus faible, puis on équilibre à
      // l'intérieur de chacun. Nombre impair : c'est toi qui choisis de
      // quel côté va l'équipe du milieu.
      var nStrong = T % 2 ? (o.strongMore ? Math.ceil(T / 2) : Math.floor(T / 2)) : T / 2;
      var sz = sizes(n, T);
      var strongCount = sz.slice(0, nStrong).reduce(function (a, b) { return a + b; }, 0);
      var sorted = list.slice().sort(function (a, b) { return b.key - a.key; });
      var strong = sorted.slice(0, strongCount), weak = sorted.slice(strongCount);
      return balance(strong, nStrong, o.mix, rnd).concat(balance(weak, T - nStrong, o.mix, rnd));
    }
    return balance(list, T, o.mix, rnd);
  }

  // Version « identifiants seulement », celle qu'utilise l'écran Équipes.
  function composeIds(players, o, rnd) {
    return compose(players, o, rnd).map(function (t) { return t.map(function (p) { return p.id; }); });
  }

  function defaultTeam(i) {
    var c = UI.COLORS[i % UI.COLORS.length];
    return { id: APP.uid('t'), name: c.label, color: c.id, members: [], coaches: [] };
  }

  // Couleurs par défaut dans l'ordre des chasubles les plus courantes,
  // sans reprendre une couleur déjà portée par une autre équipe.
  function freeColor(teams) {
    var used = teams.map(function (t) { return t.color; });
    for (var i = 0; i < UI.COLORS.length; i++) if (used.indexOf(UI.COLORS[i].id) < 0) return UI.COLORS[i];
    return UI.COLORS[teams.length % UI.COLORS.length];
  }

  function teamLevel(team, levels) {
    var xs = team.members.map(function (sid) { return levels[sid] ? levels[sid].level : null; }).filter(function (x) { return x != null; });
    return APP.mean(xs);
  }

  return {
    LEVEL_MODES: LEVEL_MODES, MIX_MODES: MIX_MODES,
    sizes: sizes, compose: compose, composeIds: composeIds, spread: spread,
    defaultTeam: defaultTeam, freeColor: freeColor, teamLevel: teamLevel,
    acts: {}, chgs: {}
  };
})();

</script>
<script>
/* js/arena.js */
/*
 * Le moteur des rencontres. Un match n'enregistre que des événements datés
 * (point, perte de balle, entrée, sortie). Tout le reste — score, temps de
 * jeu, plus/malus, statistiques — est recalculé en rejouant ces événements.
 * Ainsi, annuler une erreur ou corriger un changement oublié remet
 * automatiquement tous les chiffres d'aplomb.
 */
var ARENA = (function () {
  'use strict';
  var esc = APP.esc;

  function other(t) { return t === 'A' ? 'B' : 'A'; }

  // Le chrono est stocké comme « temps déjà écoulé + heure de reprise » :
  // si la tablette se met en veille ou si la page se recharge, le temps
  // continue de tourner juste.
  function elapsed(m) {
    var c = m.clock;
    return c.base + (c.running ? Math.max(0, (Date.now() - c.since) / 1000) : 0);
  }

  function create(lesson, idA, idB, terrain) {
    var ta = APP.byId(lesson.teams, idA), tb = APP.byId(lesson.teams, idB);
    var ind = APP.clone(lesson.indicators);
    function snap(t) {
      var members = t.members.filter(function (sid) { return LESSON.status(lesson, sid) === 'P'; });
      return { id: t.id, name: t.name, color: t.color, members: members };
    }
    var A = snap(ta), B = snap(tb);
    // Les premiers de la liste commencent sur le terrain : les élèves
    // n'ont plus qu'à corriger si ce n'est pas le bon cinq de départ.
    function lineup(t) { return ind.subs ? t.members.slice(0, lesson.maxOnField) : t.members.slice(); }
    return {
      id: APP.uid('m'), lessonId: lesson.id, cycleId: lesson.cycleId, created: Date.now(),
      terrain: terrain || '', teams: { A: A, B: B }, ind: ind,
      actions: APP.clone(lesson.actions), max: lesson.maxOnField, minutes: lesson.matchMinutes,
      lineup: { A: lineup(A), B: lineup(B) }, events: [],
      clock: { running: false, base: 0, since: 0 }, status: 'ready'
    };
  }

  function startClock(m) {
    if (m.status === 'done') return;
    if (!m.clock.running) { m.clock.running = true; m.clock.since = Date.now(); m.status = 'live'; }
  }
  function pauseClock(m) {
    if (m.clock.running) { m.clock.base = elapsed(m); m.clock.running = false; }
  }
  function finish(m) { pauseClock(m); m.status = 'done'; m.ended = Date.now(); }

  function push(m, ev) {
    ev.id = APP.uid('e');
    ev.t = Math.round(elapsed(m) * 10) / 10;
    if (m.status === 'ready') m.status = 'live';
    m.events.push(ev);
    return ev;
  }

  function action(m, id) { return APP.byId(m.actions, id); }

  // On recopie points et « unités » dans l'événement : si le barème change
  // à la leçon suivante, ce match garde la valeur qu'il avait ce jour-là.
  function score(m, team, actionId, player) {
    var a = action(m, actionId);
    if (!a) return null;
    return push(m, { type: 'score', team: team, actionId: a.id, label: a.label, points: +a.points || 0, units: +a.units || 0, shot: a.shot || 'none', player: player || null });
  }
  function turnover(m, team) { return push(m, { type: 'turnover', team: team }); }
  // Le rebond n'est pas une perte de balle : après un tir raté, soit
  // l'équipe qui tirait garde le ballon (rebond offensif, même attaque),
  // soit l'adversaire le récupère (rebond défensif, nouvelle attaque pour
  // lui, mais aucune « balle perdue » comptée au tireur).
  function rebound(m, team) { return push(m, { type: 'rebound', team: team }); }
  function setPossession(m, team) { return push(m, { type: 'poss', team: team }); }
  function sub(m, team, outId, inId) { return push(m, { type: 'sub', team: team, out: outId || null, 'in': inId || null }); }

  function lastOf(m, team) {
    for (var i = m.events.length - 1; i >= 0; i--) if (!team || m.events[i].team === team) return { ev: m.events[i], i: i };
    return null;
  }
  function undo(m, team) {
    var l = lastOf(m, team);
    if (!l) return null;
    m.events.splice(l.i, 1);
    return l.ev;
  }
  function removeEvent(m, evId) {
    m.events = m.events.filter(function (e) { return e.id !== evId; });
  }

  function describe(ev, m) {
    if (!ev) return '';
    var who = ev.player ? ' (' + APP.sname(ev.player) + ')' : '';
    if (ev.type === 'score') return (ev.points ? '+' + ev.points + ' ' : '') + ev.label + who;
    if (ev.type === 'turnover') return 'Perte de balle';
    if (ev.type === 'rebound') return 'Rebond' + (m ? ' ' + m.teams[ev.team].name : '');
    if (ev.type === 'poss') return 'Ballon donné à ' + (m ? m.teams[ev.team].name : ev.team);
    if (ev.type === 'sub') {
      return (ev.out ? APP.sname(ev.out) + ' sort' : '') + (ev.out && ev['in'] ? ', ' : '') + (ev['in'] ? APP.sname(ev['in']) + ' entre' : '');
    }
    return ev.type;
  }

  function blankTeam() {
    return { pts: 0, units: 0, made: 0, missed: 0, shots: 0, turnovers: 0, possessions: 0, possTime: 0, possWithShot: 0, possScored: 0, offReb: 0, defReb: 0, actions: {} };
  }

  // Suivi de la possession inspiré d'iPTB (Possession – Tir – But) : une
  // attaque commence quand une équipe récupère le ballon et se termine par
  // un point marqué, une perte de balle ou un rebond défensif. On sait ainsi
  // combien d'attaques ont amené un tir, combien ont rapporté des points,
  // et combien de temps chaque équipe a eu le ballon.
  function replay(m) {
    var track = !!m.ind.turnovers;
    var r = {
      score: { A: 0, B: 0 }, onField: { A: m.lineup.A.slice(), B: m.lineup.B.slice() },
      possession: null, awaitRebound: null, players: {}, teams: { A: blankTeam(), B: blankTeam() },
      timeline: [], end: elapsed(m)
    };
    ['A', 'B'].forEach(function (side) {
      m.teams[side].members.forEach(function (sid) {
        r.players[sid] = { sid: sid, team: side, sec: 0, pmP: 0, pmU: 0, pts: 0, made: 0, missed: 0, actions: {} };
      });
    });
    var lastT = 0, cur = null;
    function advance(t) {
      var dt = t - lastT;
      if (dt <= 0) return;
      ['A', 'B'].forEach(function (side) {
        r.onField[side].forEach(function (sid) { if (r.players[sid]) r.players[sid].sec += dt; });
      });
      lastT = t;
    }
    function close(t) {
      if (!cur) return;
      var T = r.teams[cur.team];
      T.possTime += Math.max(0, t - cur.start);
      if (cur.shots) T.possWithShot++;
      if (cur.pts > 0) T.possScored++;
      cur = null;
    }
    function gain(side, t) {
      if (!track || r.possession === side) return;
      close(t);
      r.possession = side;
      r.teams[side].possessions++;
      cur = { team: side, start: t, shots: 0, pts: 0 };
    }
    m.events.forEach(function (ev) {
      advance(ev.t);
      var X = ev.team, Y = other(X);
      if (ev.type !== 'sub') r.awaitRebound = null;
      if (ev.type === 'score') {
        // Une équipe qui marque avait forcément le ballon, même si personne
        // n'a noté comment elle l'a récupéré.
        if (r.possession !== null) gain(X, ev.t);
        var T = r.teams[X];
        r.score[X] += ev.points; T.pts += ev.points; T.units += ev.units;
        T.actions[ev.actionId] = (T.actions[ev.actionId] || 0) + 1;
        if (ev.shot === 'made') { T.made++; T.shots++; }
        if (ev.shot === 'missed') { T.missed++; T.shots++; }
        if (cur && cur.team === X) { if (ev.shot !== 'none') cur.shots++; cur.pts += ev.points; }
        // Seuls les joueurs sur le terrain au moment de l'action sont concernés :
        // les remplaçants ne gagnent ni ne perdent rien.
        r.onField[X].forEach(function (sid) { var p = r.players[sid]; if (p) { p.pmP += ev.points; p.pmU += ev.units; } });
        r.onField[Y].forEach(function (sid) { var p = r.players[sid]; if (p) { p.pmP -= ev.points; p.pmU -= ev.units; } });
        var who = ev.player && r.players[ev.player];
        if (who) {
          who.pts += ev.points;
          who.actions[ev.actionId] = (who.actions[ev.actionId] || 0) + 1;
          if (ev.shot === 'made') who.made++;
          if (ev.shot === 'missed') who.missed++;
        }
        // Point marqué : l'adversaire remet en jeu. Tir raté : on attend de
        // savoir qui prend le rebond.
        if (ev.shot === 'missed') r.awaitRebound = X;
        else if (ev.points > 0 || ev.shot === 'made') gain(Y, ev.t);
        r.timeline.push({ t: ev.t, A: r.score.A, B: r.score.B });
      } else if (ev.type === 'turnover') {
        r.teams[X].turnovers++;
        gain(Y, ev.t);
      } else if (ev.type === 'rebound') {
        if (r.possession === X) r.teams[X].offReb++;
        else { r.teams[X].defReb++; gain(X, ev.t); }
      } else if (ev.type === 'poss') {
        gain(X, ev.t);
      } else if (ev.type === 'sub') {
        if (ev.out) r.onField[X] = r.onField[X].filter(function (s) { return s !== ev.out; });
        if (ev['in'] && r.onField[X].indexOf(ev['in']) < 0) r.onField[X].push(ev['in']);
      }
    });
    r.end = Math.max(r.end, lastT);
    advance(r.end);
    close(r.end);
    return r;
  }

  // Pourcentage arrondi, ou null s'il n'y a rien à diviser : on préfère un
  // tiret à un « 0 % » trompeur quand une équipe n'a tenté aucun tir.
  function pct(a, b) { return b ? Math.round(100 * a / b) : null; }
  function fmtPct(x) { return x == null ? '–' : x + ' %'; }

  // Les indicateurs du bilan, calculés une seule fois pour les deux équipes.
  function teamStats(m, r) {
    var out = {};
    ['A', 'B'].forEach(function (s) {
      var T = r.teams[s], O = r.teams[other(s)];
      var totalPoss = T.possTime + O.possTime;
      out[s] = {
        ptsShare: pct(T.pts, T.pts + O.pts),
        shotRate: pct(T.made, T.shots),
        possShare: pct(T.possTime, totalPoss),
        possWithShot: pct(T.possWithShot, T.possessions),
        possScored: pct(T.possScored, T.possessions),
        lossRate: pct(T.turnovers, T.possessions),
        offRebRate: pct(T.offReb, T.offReb + O.defReb),
        shotsPerPoss: T.possessions ? T.shots / T.possessions : null,
        ptsPerPoss: T.possessions ? T.pts / T.possessions : null
      };
    });
    return out;
  }

  function winner(r) { return r.score.A === r.score.B ? null : (r.score.A > r.score.B ? 'A' : 'B'); }

  // Découpage en tranches : 1 minute pour un match court, 2 au-delà. Assez
  // fin pour voir un temps fort, assez gros pour rester lisible.
  function periods(m, r) {
    r = r || replay(m);
    var end = Math.max(r.end, 60);
    var step = end > 540 ? 120 : 60;
    var rows = [], cumA = 0, cumB = 0;
    for (var from = 0; from < end; from += step) {
      var to = from + step, a = 0, b = 0;
      m.events.forEach(function (ev) {
        if (ev.type !== 'score' || ev.t < from || ev.t >= to) return;
        if (ev.team === 'A') a += ev.points; else b += ev.points;
      });
      cumA += a; cumB += b;
      rows.push({ from: from, to: Math.min(to, end), A: a, B: b, cumA: cumA, cumB: cumB });
    }
    return rows;
  }

  function ratio(a, b) { return b ? a / b : null; }

  /* ---------- Bilan d'un match ---------- */

  // Même bilan pour l'élève et pour l'enseignant, à une différence près :
  // le plus/malus n'apparaît que côté enseignant.
  function reportHTML(m, opts) {
    opts = opts || {};
    var r = replay(m), A = m.teams.A, B = m.teams.B, ind = m.ind;
    var ca = UI.color(A.color).hex, cb = UI.color(B.color).hex;
    var TA = r.teams.A, TB = r.teams.B;
    var h = '';

    h += '<div class="score-head">' + UI.chip(A) + '<b class="big-score">' + r.score.A + ' – ' + r.score.B + '</b>' + UI.chip(B) + '</div>';
    h += '<p class="muted center">' + APP.fmtTime(r.end) + ' de jeu' + (m.status !== 'done' ? ' · match en cours' : '') + '</p>';

    h += '<section class="card"><h3>Qui a dominé ?</h3>' +
      UI.forceChart(r.timeline, ca, cb, r.end, { nameA: A.name, nameB: B.name }) +
      '<p class="hint">Quand la courbe monte, les ' + esc(A.name) + ' prennent l\'avantage ; quand elle descend, ce sont les ' + esc(B.name) + '.</p>';
    var per = periods(m, r);
    h += '<div class="table-wrap"><table class="tbl small"><thead><tr><th>Moment</th><th>' + UI.chip(A) + '</th><th>' + UI.chip(B) + '</th><th>Score</th><th>Devant</th></tr></thead><tbody>' +
      per.map(function (p) {
        var lead = p.cumA === p.cumB ? '<span class="muted">égalité</span>' : UI.chip(p.cumA > p.cumB ? A : B);
        var hot = p.A - p.B >= 3 ? ' class="hot-a"' : p.B - p.A >= 3 ? ' class="hot-b"' : '';
        return '<tr' + hot + '><td>' + Math.round(p.from / 60) + '–' + Math.round(p.to / 60) + ' min</td><td>+' + p.A + '</td><td>+' + p.B + '</td><td>' + p.cumA + ' – ' + p.cumB + '</td><td>' + lead + '</td></tr>';
      }).join('') + '</tbody></table></div></section>';
